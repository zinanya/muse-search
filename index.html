<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f1edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}

.container {
    max-width: 900px;
    margin: 0 auto;

    background: rgba(255,255,255,0.96);

    border-radius: 30px;

    padding: 30px 22px 40px;

    box-shadow:
        0 8px 25px rgba(120,90,140,0.15);
}

/* =========================
   タイトル
========================= */

h1 {
    font-size: 36px;
    color: #c86fa8;

    margin: 0 0 10px;

    letter-spacing: 2px;
}

.description {
    font-size: 17px;
    color: #776b80;

    line-height: 1.7;

    margin-bottom: 30px;
}

h2 {
    font-size: 24px;
    color: #8d76c7;

    margin: 0 0 22px;

    line-height: 1.5;
}

/* =========================
   通常ボタン
========================= */

.choices {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;

    max-width: 650px;

    margin: 0 auto;
}

button {
    border: none;

    border-radius: 18px;

    cursor: pointer;

    font-family: inherit;

    transition: 0.18s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

.entrance-button {
    padding: 20px 12px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color: white;

    font-size: 19px;

    font-weight: bold;

    box-shadow:
        0 5px 12px rgba(150,110,170,0.18);
}

/* =========================
   パターンカード
========================= */

.pattern-list {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;

    max-width: 820px;

    margin: 0 auto;
}

.pattern-card {
    width: 100%;

    padding: 15px 12px 17px;

    background:
        linear-gradient(
            135deg,
            #fffaff,
            #f8f4ff
        );

    border:
        2px solid #e3d5f3;

    border-radius: 20px;

    box-shadow:
        0 4px 10px rgba(130,100,160,0.08);
}

.pattern-card:hover {
    border-color: #c9aeea;

    box-shadow:
        0 6px 15px rgba(130,100,160,0.14);
}

.pattern-number {
    display: inline-block;

    padding: 3px 10px;

    margin-bottom: 8px;

    border-radius: 20px;

    background: #f0e6fa;

    color: #8d76c7;

    font-size: 13px;

    font-weight: bold;
}

/* =========================
   通路セット
========================= */

.route-set {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin: 3px auto 10px;
}

.route-side {
    width: 44%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.route-label {
    font-size: 13px;

    color: #a17bb8;

    font-weight: bold;

    margin-bottom: 2px;
}

.route-plus {
    font-size: 17px;

    color: #c69bd1;

    font-weight: bold;
}

/* =========================
   図形
========================= */

.shape {
    position: relative;

    width: 115px;
    height: 82px;

    margin: 0 auto;
}

.shape-line {
    position: absolute;

    background: #8f76b5;

    border-radius: 2px;
}

/* I字 */

.shape-i .vertical {
    width: 5px;
    height: 65px;

    left: 55px;
    top: 8px;
}

/* L字 └ */

.shape-l .vertical {
    width: 5px;
    height: 58px;

    left: 20px;
    top: 8px;
}

.shape-l .horizontal {
    width: 78px;
    height: 5px;

    left: 20px;
    bottom: 14px;
}

/* 逆L字 ┘ */

.shape-reverse-l .vertical {
    width: 5px;
    height: 58px;

    right: 20px;
    top: 8px;
}

.shape-reverse-l .horizontal {
    width: 78px;
    height: 5px;

    left: 17px;
    bottom: 14px;
}

/* 逆トの字 */

.shape-reverse-t .vertical {
    width: 5px;
    height: 63px;

    right: 20px;
    top: 8px;
}

.shape-reverse-t .horizontal {
    width: 80px;
    height: 5px;

    left: 15px;
    top: 38px;
}

/* トの字 */

.shape-t .vertical {
    width: 5px;
    height: 58px;

    left: 55px;
    top: 20px;
}

.shape-t .horizontal {
    width: 80px;
    height: 5px;

    left: 17px;
    top: 20px;
}

/* 横棒 */

.shape-horizontal .horizontal {
    width: 95px;
    height: 5px;

    left: 10px;
    top: 39px;
}

/* 凸 */

.shape-convex svg,
.shape-complex svg,
.shape-cross-room svg,
.shape-hall svg,
.shape-bigroom svg {
    width: 115px;
    height: 82px;
}

/* 1マス部屋 */

.shape-room {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-room .room {
    width: 25px;
    height: 25px;

    border: 4px solid #8f76b5;

    border-radius: 3px;
}

/* 1マス部屋＋十字
       十
       □
       ↑
*/

.shape-cross-room {
    display: flex;

    align-items: center;
    justify-content: center;
}

/* 1マス部屋＋ホール
   大きい四角
       □
*/

.shape-hall {
    display: flex;

    align-items: center;
    justify-content: center;
}

/* 大部屋 */

.shape-bigroom {
    display: flex;

    align-items: center;
    justify-content: center;
}

/* =========================
   カード情報
========================= */

.card-location {
    color: #765fb0;

    font-size: 16px;

    font-weight: bold;

    line-height: 1.5;

    margin-top: 7px;
}

.card-recommendation {
    color: #c26d9d;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.5;

    margin-top: 5px;
}

/* =========================
   特殊質問
========================= */

.yes-no {
    max-width: 500px;

    margin: 0 auto;
}

.yes {
    padding: 18px;

    background:
        linear-gradient(
            135deg,
            #f5a5c9,
            #e68eb9
        );

    color: white;

    font-size: 18px;

    font-weight: bold;
}

.no {
    padding: 18px;

    background:
        linear-gradient(
            135deg,
            #aeb5ec,
            #8f91d8
        );

    color: white;

    font-size: 18px;

    font-weight: bold;
}

/* =========================
   結果
========================= */

.result {
    padding: 15px 5px;
}

.result-icon {
    font-size: 48px;

    margin-bottom: 5px;
}

.result-title {
    font-size: 27px;

    color: #c86fa8;

    font-weight: bold;

    margin-bottom: 15px;
}

.result-box {
    max-width: 600px;

    margin: 0 auto 20px;

    padding: 22px 18px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );
}

.result-location {
    color: #765fb0;

    font-size: 22px;

    font-weight: bold;

    line-height: 1.7;
}

.recommendation {
    color: #c26d9d;

    font-size: 17px;

    font-weight: bold;

    line-height: 1.7;

    margin-top: 12px;
}

.time-warning {
    margin-top: 12px;

    color: #8f76b5;

    font-size: 14px;

    font-weight: bold;
}

.back-button {
    margin-top: 20px;

    padding: 12px 24px;

    background: #ddd5e5;

    color: #655b6b;

    font-size: 15px;
}

.hidden {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 650px) {

    body {
        padding: 15px 8px;
    }

    .container {
        padding:
            25px 12px 30px;

        border-radius: 24px;
    }

    h1 {
        font-size: 29px;
    }

    h2 {
        font-size: 20px;
    }

    .description {
        font-size: 15px;
    }

    .choices {
        grid-template-columns: 1fr;
    }

    .pattern-list {
        grid-template-columns: 1fr;
    }

    .pattern-card {
        padding: 13px 8px 15px;
    }

    .shape {
        transform: scale(0.9);
    }

    .card-location {
        font-size: 15px;
    }

    .card-recommendation {
        font-size: 13px;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- =========================
     入口選択
========================= -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        入口の形を選択して、<br>
        マップと一致する通路を探します。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="choices">

        <button
            class="entrance-button"
            onclick="selectEntrance('left-center-right')"
        >
            左＋中央＋右
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('left-center')"
        >
            左＋中央
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('center-right')"
        >
            中央＋右
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('left-right')"
        >
            左＋右
        </button>

    </div>

</div>


<!-- =========================
     特殊条件
========================= -->

<div
    id="special-screen"
    class="hidden"
>

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>

    <p class="description">
        「左＋中央」の入口の場合のみ確認します。
    </p>

    <div class="choices yes-no">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>

        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 戻る
    </button>

</div>


<!-- =========================
     パターン選択
========================= -->

<div
    id="pattern-screen"
    class="hidden"
>

    <h2 id="pattern-question">
    </h2>

    <p class="description">
        自分のマップと同じ組み合わせを選択してください。
    </p>

    <div
        id="pattern-list"
        class="pattern-list"
    >
    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- =========================
     結果
========================= -->

<div
    id="result-screen"
    class="hidden"
>

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            >
            </div>

            <div
                id="result-recommendation"
                class="recommendation"
            >
            </div>

            <div class="time-warning">
                ⏰ 時間に気を付けて進んでね！
            </div>

        </div>

        <button
            class="entrance-button"
            onclick="goHome()"
        >
            もう一度検索する
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   判定データ

   新しいマップを追加する場合は、
   この配列に追加するだけ。
===================================================== */

const patterns = [

    /* ① 左＋中央＋右 */
    {
        entrance: "left-center-right",

        shapes: {
            left: "i",
            center: "room",
            right: "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から右に進むのがおすすめです！"
    },

    /* ② 左＋中央＋右 */
    {
        entrance: "left-center-right",

        shapes: {
            left: "horizontal",
            center: "room",
            right: "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、やや左に向かうのがおすすめです！"
    },

    /* ③ 左＋中央＋右 */
    {
        entrance: "left-center-right",

        shapes: {
            left: "reverse-l",
            center: "room-cross",
            right: "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右側に向かうのがおすすめです！"
    },

    /* ④ 左＋中央 */
    {
        entrance: "left-center",

        shapes: {
            left: "immediate-room",
            center: "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "⭐ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
    },

    /* ⑤ 左＋中央 */
    {
        entrance: "left-center",

        shapes: {
            left: "l",
            center: "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです。階段のある通路は通り抜けてね！"
    },

    /* ⑥ 中央＋右 */
    {
        entrance: "center-right",

        shapes: {
            center: "room-cross",
            right: "complex-y"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },

    /* ⑦ 中央＋右 */
    {
        entrance: "center-right",

        shapes: {
            center: "room-cross",
            right: "big-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！"
    },

    /* ⑧ 中央＋右 */
    {
        entrance: "center-right",

        shapes: {
            center: "room-cross",
            right: "convex"
        },

        location:
            "中央奥、やや右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右を目指すのがおすすめです！"
    },

    /* ⑨ 左＋右 */
    {
        entrance: "left-right",

        shapes: {
            left: "reverse-t",
            right: "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進み、突き当りで左に進むのがおすすめです！"
    },

    /* ⑩ 左＋右 */
    {
        entrance: "left-right",

        shapes: {
            left: "reverse-l",
            right: "complex-2"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進むのがおすすめです！"
    }

];


/* =====================================================
   入口の名前
===================================================== */

const entranceNames = {

    "left-center-right":
        "左＋中央＋右",

    "left-center":
        "左＋中央",

    "center-right":
        "中央＋右",

    "left-right":
        "左＋右"

};


/* =====================================================
   状態
===================================================== */

let currentEntrance = null;


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(entrance) {

    currentEntrance = entrance;

    hideAllScreens();

    /*
     * 左＋中央の場合だけ、
     * 「左に入ってすぐ部屋があるか」を先に確認
     */

    if (entrance === "left-center") {

        document
            .getElementById("special-screen")
            .classList
            .remove("hidden");

        return;
    }

    showPatterns();

}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(hasRoom) {

    if (hasRoom) {

        showResult(
            "左側にミューズ部屋があります！",
            "⭐ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
        );

        return;
    }

    showPatterns();
}


/* =====================================================
   パターン表示
===================================================== */

function showPatterns() {

    hideAllScreens();

    const list =
        document.getElementById("pattern-list");

    list.innerHTML = "";

    const matchingPatterns =
        patterns.filter(
            pattern =>
                pattern.entrance === currentEntrance
        );

    document
        .getElementById("pattern-question")
        .textContent =
            `${entranceNames[currentEntrance]}の通路の形を選択してください`;


    matchingPatterns.forEach(
        (pattern, index) => {

            const button =
                document.createElement("button");

            button.className =
                "pattern-card";

            button.innerHTML = `

                <div class="pattern-number">
                    パターン ${index + 1}
                </div>

                <div class="route-set">

                    ${createRouteSide(
                        "左",
                        pattern.shapes.left
                    )}

                    ${
                        pattern.shapes.center
                        ?
                        `
                        <div class="route-plus">
                            ＋
                        </div>

                        ${createRouteSide(
                            "中央",
                            pattern.shapes.center
                        )}
                        `
                        :
                        ""
                    }

                    ${
                        pattern.shapes.right
                        ?
                        `
                        <div class="route-plus">
                            ＋
                        </div>

                        ${createRouteSide(
                            "右",
                            pattern.shapes.right
                        )}
                        `
                        :
                        ""
                    }

                </div>

                <div class="card-location">
                    ${pattern.location}
                </div>

                <div class="card-recommendation">
                    ${pattern.recommendation}
                </div>

            `;

            button.onclick =
                function() {

                    showResult(
                        pattern.location,
                        pattern.recommendation
                    );

                };

            list.appendChild(button);

        }
    );


    document
        .getElementById("pattern-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   左・中央・右の図形
===================================================== */

function createRouteSide(label, shape) {

    return `

        <div class="route-side">

            <div class="route-label">
                ${label}
            </div>

            ${createShapeHTML(shape)}

        </div>

    `;
}


/* =====================================================
   図形HTML
===================================================== */

function createShapeHTML(shape) {

    /* I字 */

    if (shape === "i") {

        return `
            <div class="shape shape-i">
                <div class="shape-line vertical"></div>
            </div>
        `;
    }


    /* L字 */

    if (shape === "l") {

        return `
            <div class="shape shape-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆L字 */

    if (shape === "reverse-l") {

        return `
            <div class="shape shape-reverse-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆トの字 */

    if (shape === "reverse-t") {

        return `
            <div class="shape shape-reverse-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* トの字 */

    if (shape === "t") {

        return `
            <div class="shape shape-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 横棒 */

    if (shape === "horizontal") {

        return `
            <div class="shape shape-horizontal">
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 1マス部屋 */

    if (shape === "room") {

        return `
            <div class="shape shape-room">
                <div class="room"></div>
            </div>
        `;
    }


    /* 1マス部屋＋十字

          十
          □
          ↑
    */

    if (shape === "room-cross") {

        return `
            <div class="shape shape-cross-room">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- 十字 -->
                    <line
                        x1="57"
                        y1="8"
                        x2="57"
                        y2="31"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="44"
                        y1="20"
                        x2="70"
                        y2="20"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <!-- 1マス部屋 -->
                    <rect
                        x="45"
                        y="37"
                        width="24"
                        height="24"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="4"
                        rx="2"
                    />

                    <!-- 下向きの入口 -->
                    <line
                        x1="57"
                        y1="61"
                        x2="57"
                        y2="73"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <polygon
                        points="57,78 52,70 62,70"
                        fill="#8f76b5"
                    />

                </svg>

            </div>
        `;
    }


    /* 1マス部屋＋I字 */

    if (shape === "room-i") {

        return `
            <div class="shape">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        x="45"
                        y="8"
                        width="25"
                        height="25"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="4"
                        rx="2"
                    />

                    <line
                        x1="57"
                        y1="34"
                        x2="57"
                        y2="73"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* 1マス部屋＋ホール

       大きい四角
           □
    */

    if (shape === "room-hall") {

        return `
            <div class="shape shape-hall">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- 大きなホール -->
                    <rect
                        x="25"
                        y="8"
                        width="65"
                        height="48"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        rx="3"
                    />

                    <!-- 小さい部屋 -->
                    <rect
                        x="48"
                        y="58"
                        width="20"
                        height="20"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="4"
                        rx="2"
                    />

                </svg>

            </div>
        `;
    }


    /* すぐ部屋 */

    if (shape === "immediate-room") {

        return `
            <div class="shape shape-room">

                <div
                    class="room"
                    style="
                        width:34px;
                        height:34px;
                    "
                ></div>

            </div>
        `;
    }


    /* 凸 */

    if (shape === "convex") {

        return `
            <div class="shape shape-convex">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            8,65
                            8,38
                            32,38
                            32,16
                            83,16
                            83,38
                            107,38
                            107,65
                            8,65
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* 大部屋 */

    if (shape === "big-room") {

        return `
            <div class="shape shape-bigroom">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        x="17"
                        y="12"
                        width="81"
                        height="58"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        rx="3"
                    />

                </svg>

            </div>
        `;
    }


    /* 複雑なY字系 */

    if (shape === "complex-y") {

        return `
            <div class="shape shape-complex">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="
                            M57 75
                            L57 43
                            L35 20
                            M57 43
                            L80 20
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <line
                        x1="57"
                        y1="43"
                        x2="57"
                        y2="12"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* パターン⑩の右側 */

    if (shape === "complex-2") {

        return `
            <div class="shape shape-complex">

                <svg
                    viewBox="0 0 115 82"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="
                            M10 58
                            L45 58
                            L45 20
                            L95 20
                            L95 58
                            L108 58
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>
        `;
    }


    return "";
}


/* =====================================================
   結果表示
===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();

    document
        .getElementById("result-location")
        .textContent =
            location;

    document
        .getElementById("result-recommendation")
        .textContent =
            recommendation;

    document
        .getElementById("result-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   画面を全部隠す
===================================================== */

function hideAllScreens() {

    document
        .getElementById("entrance-screen")
        .classList
        .add("hidden");

    document
        .getElementById("special-screen")
        .classList
        .add("hidden");

    document
        .getElementById("pattern-screen")
        .classList
        .add("hidden");

    document
        .getElementById("result-screen")
        .classList
        .add("hidden");
}


/* =====================================================
   最初に戻る
===================================================== */

function goHome() {

    currentEntrance = null;

    hideAllScreens();

    document
        .getElementById("entrance-screen")
        .classList
        .remove("hidden");
}

</script>
