<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f2edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}

.container {
    max-width: 760px;
    margin: 0 auto;

    background: rgba(255,255,255,0.96);

    border-radius: 30px;

    padding: 32px 22px 40px;

    box-shadow:
        0 8px 25px
        rgba(120,90,140,0.15);
}

/* =========================
   タイトル
========================= */

h1 {
    font-size: 36px;
    color: #c86fa8;

    margin:
        0 0 12px;

    letter-spacing: 2px;
}

.description {
    font-size: 17px;
    color: #776b80;

    line-height: 1.8;

    margin-bottom: 30px;
}

h2 {
    font-size: 24px;
    color: #8d76c7;

    margin:
        0 0 22px;

    line-height: 1.5;
}

/* =========================
   選択肢
========================= */

.choices {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;

    max-width: 650px;

    margin: 0 auto;
}

button {
    border: none;
    border-radius: 18px;

    padding:
        18px 14px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(150,110,170,0.18);

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 15px
        rgba(150,110,170,0.25);
}

button:active {
    transform: scale(0.97);
}

/* =========================
   図形ボタン
========================= */

.shape-button {
    min-height: 165px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 8px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        );

    color: #51465c;

    border:
        2px solid #decff5;
}

.shape-button:hover {
    border-color:
        #c9aeea;

    background:
        #fffaff;
}

.shape-name {
    font-size: 15px;
    color: #776b80;
}

/* =========================
   図形共通
========================= */

.shape {
    width: 150px;
    height: 110px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-line {
    position: absolute;

    background:
        #51465c;

    border-radius: 3px;
}

/* =========================
   I字
========================= */

.shape-i .vertical {
    width: 5px;
    height: 92px;

    left: 72px;
    top: 9px;
}

/* =========================
   L字
========================= */

.shape-l .vertical {
    width: 5px;
    height: 82px;

    left: 20px;
    top: 8px;
}

.shape-l .horizontal {
    width: 110px;
    height: 5px;

    left: 20px;
    bottom: 14px;
}

/* =========================
   逆L字
========================= */

.shape-reverse-l .vertical {
    width: 5px;
    height: 82px;

    right: 20px;
    top: 8px;
}

.shape-reverse-l .horizontal {
    width: 115px;
    height: 5px;

    left: 8px;
    bottom: 14px;
}

/* =========================
   逆トの字
========================= */

.shape-reverse-t .vertical {
    width: 5px;
    height: 86px;

    right: 20px;
    top: 8px;
}

.shape-reverse-t .horizontal {
    width: 110px;
    height: 5px;

    left: 8px;
    top: 50px;
}

/* =========================
   トの字
========================= */

.shape-t .vertical {
    width: 5px;
    height: 82px;

    left: 72px;
    top: 25px;
}

.shape-t .horizontal {
    width: 115px;
    height: 5px;

    left: 20px;
    top: 25px;
}

/* =========================
   凸
========================= */

.shape-convex svg {
    width: 150px;
    height: 110px;
}

/* =========================
   逆L字＋横棒
========================= */

.shape-complex svg {
    width: 150px;
    height: 110px;
}

/* =========================
   1マス部屋＋十字

       十
       □

   「十」と「□」を
   くっつけて表示
========================= */

.shape-room-cross {
    width: 150px;
    height: 110px;
}

.shape-room-cross .cross {
    position: absolute;

    width: 32px;
    height: 32px;

    left: 59px;
    top: 12px;
}

.shape-room-cross .cross::before,
.shape-room-cross .cross::after {
    content: "";

    position: absolute;

    background: #51465c;

    border-radius: 2px;
}

.shape-room-cross .cross::before {
    width: 32px;
    height: 5px;

    left: 0;
    top: 13px;
}

.shape-room-cross .cross::after {
    width: 5px;
    height: 32px;

    left: 13px;
    top: 0;
}

.shape-room-cross .room {
    position: absolute;

    width: 32px;
    height: 32px;

    left: 59px;
    top: 46px;

    border:
        5px solid #51465c;

    background:
        transparent;

    border-radius: 2px;
}

/* =========================
   1マス部屋＋ホール

   ┌─────────┐
   │         │
   │         │
   └────┬────┘
        □

   大きい四角の下に
   1マス部屋
========================= */

.shape-room-hall {
    width: 150px;
    height: 110px;
}

.shape-room-hall .hall {
    position: absolute;

    width: 100px;
    height: 62px;

    left: 25px;
    top: 8px;

    border:
        5px solid #51465c;

    border-radius: 3px;
}

.shape-room-hall .room {
    position: absolute;

    width: 27px;
    height: 27px;

    left: 61px;
    top: 68px;

    border:
        5px solid #51465c;

    background:
        #ffffff;

    border-radius: 2px;
}

/* =========================
   大部屋
========================= */

.shape-large-room {
    width: 150px;
    height: 110px;
}

.shape-large-room .room {
    width: 105px;
    height: 75px;

    border:
        5px solid #51465c;

    border-radius: 3px;
}

/* =========================
   1マス部屋
========================= */

.shape-one-room {
    width: 150px;
    height: 110px;
}

.shape-one-room .room {
    width: 34px;
    height: 34px;

    border:
        5px solid #51465c;

    border-radius: 2px;
}

/* =========================
   1マス＋I字
========================= */

.shape-room-i {
    width: 150px;
    height: 110px;
}

.shape-room-i .room {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 61px;
    top: 8px;

    border:
        5px solid #51465c;
}

.shape-room-i .vertical {
    position: absolute;

    width: 5px;
    height: 60px;

    left: 72px;
    top: 36px;

    background: #51465c;
}

/* =========================
   1マス＋十字
========================= */

.shape-room-cross-simple {
    width: 150px;
    height: 110px;
}

/* =========================
   逆L＋逆L複合
========================= */

.shape-double-reverse-l svg {
    width: 150px;
    height: 110px;
}

/* =========================
   結果
========================= */

.result {
    padding:
        20px 10px;
}

.result-icon {
    font-size: 45px;
    margin-bottom: 8px;
}

.result-title {
    font-size: 28px;

    color: #c86fa8;

    margin-bottom: 18px;
}

.result-box {
    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );

    border-radius: 22px;

    padding:
        22px 18px;

    margin:
        18px auto;

    max-width:
        570px;
}

.result-location {
    font-size: 21px;

    font-weight: bold;

    color: #765fb0;

    line-height: 1.7;
}

.recommendation {
    margin-top: 16px;

    font-size: 18px;

    font-weight: bold;

    color: #c26d9d;

    line-height: 1.7;
}

.time-warning {
    margin-top: 15px;

    font-size: 16px;

    color: #806f85;

    line-height: 1.7;
}

/* =========================
   戻る
========================= */

.back-button {
    margin-top: 22px;

    background:
        #ddd5e5;

    color:
        #655b6b;

    box-shadow:
        none;

    font-size:
        15px;

    padding:
        12px 22px;
}

.back-button:hover {
    background:
        #d2c7dc;

    box-shadow:
        none;
}

/* =========================
   その他
========================= */

.yes-no {
    max-width: 500px;
    margin: 0 auto;
}

.yes {
    background:
        linear-gradient(
            135deg,
            #f5a5c9,
            #e68eb9
        );
}

.no {
    background:
        linear-gradient(
            135deg,
            #aeb5ec,
            #8f91d8
        );
}

.not-found {
    font-size: 17px;

    line-height: 1.8;

    color: #776b80;

    grid-column:
        1 / -1;
}

.hidden {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    body {
        padding:
            15px 10px;
    }

    .container {
        padding:
            28px 14px 35px;

        border-radius:
            24px;
    }

    h1 {
        font-size:
            29px;
    }

    h2 {
        font-size:
            21px;
    }

    .description {
        font-size:
            15px;
    }

    .choices {
        grid-template-columns:
            1fr;
    }

    button {
        font-size:
            17px;

        padding:
            17px 10px;
    }

    .shape-button {
        min-height:
            150px;
    }

    .result-title {
        font-size:
            25px;
    }

    .result-location {
        font-size:
            19px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     入口選択
========================= -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        いくつかの特徴を選択して<br>
        ミューズの位置を特定します。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="choices">

        <button onclick="selectEntrance('center-right-left')">
            中央＋右＋左
        </button>

        <button onclick="selectEntrance('center-right')">
            中央＋右
        </button>

        <button onclick="selectEntrance('center-left')">
            中央＋左
        </button>

        <button onclick="selectEntrance('right-left')">
            右＋左
        </button>

    </div>

</div>


<!-- =========================
     特殊条件
========================= -->

<div id="special-screen" class="hidden">

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>

    <p class="description">
        「中央＋左」の入口の場合に確認します。
    </p>

    <div class="choices yes-no">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>

        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 戻る
    </button>

</div>


<!-- =========================
     通路形状選択
========================= -->

<div id="shape-screen" class="hidden">

    <h2 id="shape-question"></h2>

    <div
        id="shape-choices"
        class="choices"
    ></div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- =========================
     結果
========================= -->

<div id="result-screen" class="hidden">

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            ></div>

            <div
                id="result-recommendation"
                class="recommendation"
            ></div>

            <div
                id="result-warning"
                class="time-warning"
            >
                ⏰ 時間に気を付けてね！
            </div>

        </div>

        <button onclick="goHome()">
            もう一度検索する
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   ★ 判定データ ★

   新しいマップを追加するときは、
   この patterns に追加するだけ。
===================================================== */

const patterns = [

    /* ① L＋C＋R
       L → I字
       C → 1マス部屋
       R → L字
    */

    {
        entrance: "center-right-left",

        conditions: {
            left: "i",
            center: "one-room",
            right: "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 中央から右に進むのがおすすめです！"
    },


    /* ② L＋C＋R
       L → 横棒
       C → 1マス部屋
       R → ト字
    */

    {
        entrance: "center-right-left",

        conditions: {
            left: "horizontal",
            center: "one-room",
            right: "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、やや左に向かうのがおすすめです！"
    },


    /* ③ L＋C＋R
       L → 逆L字
       C → 1マス部屋＋十字
       R → L字
    */

    {
        entrance: "center-right-left",

        conditions: {
            left: "reverse-l",
            center: "room-cross",
            right: "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、右側に向かうのがおすすめです！"
    },


    /* ④ L＋C
       L → すぐに部屋
       C → 1マス部屋＋ホール
    */

    {
        entrance: "center-left",

        conditions: {
            left: "one-room",
            center: "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "☆ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
    },


    /* ⑤ L＋C
       L → L字
       C → 1マス＋I字
    */

    {
        entrance: "center-left",

        conditions: {
            left: "l",
            center: "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進むのがおすすめです。階段のある通路は通り抜けてね！"
    },


    /* ⑥ C＋R
       C → 1マス部屋＋十字
       R → 特殊な複合形
    */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "double-reverse-l"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },


    /* ⑦ C＋R
       C → 1マス部屋＋十字
       R → 大部屋
    */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "large-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進むのがおすすめです！"
    },


    /* ⑧ C＋R
       C → 1マス部屋＋十字
       R → 凸字
    */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "convex"
        },

        location:
            "中央奥やや右側にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、右を目指すのがおすすめです！"
    },


    /* ⑨ L＋R
       L → 逆ト字
       R → 逆L字
    */

    {
        entrance: "right-left",

        conditions: {
            left: "reverse-t",
            right: "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 右側を進み、突き当りで左に進むのがおすすめです！"
    },


    /* ⑩ L＋R
       L → 逆L字
       R → 複合形
    */

    {
        entrance: "right-left",

        conditions: {
            left: "reverse-l",
            right: "complex"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 右側を進むのがおすすめです！"
    }

];


/* =====================================================
   図形名
===================================================== */

const shapeNames = {

    i:
        "I字",

    l:
        "L字",

    "reverse-l":
        "逆L字",

    "reverse-t":
        "逆トの字",

    t:
        "トの字",

    horizontal:
        "横棒",

    convex:
        "凸の字",

    "one-room":
        "1マス部屋",

    "room-cross":
        "1マス部屋＋十字",

    "room-hall":
        "1マス部屋＋ホール",

    "room-i":
        "1マス＋I字",

    "large-room":
        "大部屋",

    complex:
        "逆L字＋横棒",

    "double-reverse-l":
        "Y字状の複合通路"
};


/* =====================================================
   状態
===================================================== */

let currentEntrance = null;
let answers = {};
let currentDirection = null;


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(entrance) {

    currentEntrance = entrance;

    answers = {};

    hideAllScreens();

    /*
       特殊条件は
       「中央＋左」のときだけ確認
    */

    if (entrance === "center-left") {

        document
            .getElementById("special-screen")
            .classList
            .remove("hidden");

        return;
    }

    showNextShape();
}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(hasRoom) {

    if (hasRoom) {

        showResult(
            "左側にミューズ部屋があります！",
            "☆ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
        );

        return;
    }

    answers.special = false;

    showNextShape();
}


/* =====================================================
   必要な方向を取得
===================================================== */

function getRequiredDirections() {

    if (currentEntrance === "right-left") {

        return [
            "left",
            "right"
        ];

    }

    if (currentEntrance === "center-right") {

        return [
            "center",
            "right"
        ];

    }

    if (currentEntrance === "center-left") {

        return [
            "center",
            "left"
        ];

    }

    if (currentEntrance === "center-right-left") {

        return [
            "left",
            "center",
            "right"
        ];

    }

    return [];
}


/* =====================================================
   現在の方向に存在する図形だけ取得
===================================================== */

function getAvailableShapes(
    entrance,
    direction
) {

    const availableShapes = new Set();

    patterns
        .filter(
            pattern =>
                pattern.entrance === entrance
        )
        .forEach(
            pattern => {

                if (
                    pattern.conditions[direction]
                ) {

                    availableShapes.add(
                        pattern.conditions[direction]
                    );
                }

            }
        );

    return Array.from(availableShapes);
}


/* =====================================================
   次の質問
===================================================== */

function showNextShape() {

    hideAllScreens();

    const requiredDirections =
        getRequiredDirections();

    /*
       まだ選択していない方向
    */

    const nextDirection =
        requiredDirections.find(
            direction =>
                answers[direction] === undefined
        );

    /*
       全部選択済み
    */

    if (!nextDirection) {

        checkResult();

        return;
    }

    currentDirection =
        nextDirection;

    const directionNames = {

        center:
            "中央",

        right:
            "右",

        left:
            "左"
    };

    document
        .getElementById("shape-question")
        .textContent =
        `${directionNames[nextDirection]}の通路はどの形？`;

    const availableShapes =
        getAvailableShapes(
            currentEntrance,
            nextDirection
        );

    const choices =
        document
            .getElementById("shape-choices");

    choices.innerHTML = "";


    /*
       図形ボタン生成
    */

    availableShapes.forEach(
        shape => {

            const button =
                document.createElement("button");

            button.className =
                "shape-button";

            button.innerHTML =
                createShapeHTML(shape) +

                `
                <span class="shape-name">
                    ${shapeNames[shape]}
                </span>
                `;

            button.onclick =
                function() {

                    answers[currentDirection] =
                        shape;

                    showNextShape();

                };

            choices.appendChild(button);

        }
    );


    if (availableShapes.length === 0) {

        choices.innerHTML = `
            <div class="not-found">
                この方向に登録されている
                通路形状がありません。
            </div>
        `;
    }

    document
        .getElementById("shape-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   図形HTML
===================================================== */

function createShapeHTML(shape) {

    /* I字 */

    if (shape === "i") {

        return `
            <div class="shape shape-i">
                <div class="shape-line vertical"></div>
            </div>
        `;
    }


    /* L字 */

    if (shape === "l") {

        return `
            <div class="shape shape-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆L字 */

    if (shape === "reverse-l") {

        return `
            <div class="shape shape-reverse-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆ト字 */

    if (shape === "reverse-t") {

        return `
            <div class="shape shape-reverse-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* ト字 */

    if (shape === "t") {

        return `
            <div class="shape shape-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 横棒 */

    if (shape === "horizontal") {

        return `
            <div class="shape">
                <div
                    class="shape-line"
                    style="
                        width:125px;
                        height:5px;
                        left:13px;
                        top:53px;
                    "
                ></div>
            </div>
        `;
    }


    /* 凸 */

    if (shape === "convex") {

        return `
            <div class="shape">
                <svg
                    width="150"
                    height="110"
                    viewBox="0 0 150 110"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <polyline
                        points="
                            8,90
                            8,45
                            53,45
                            58,12
                            95,12
                            95,45
                            140,45
                            140,90
                            8,90
                        "
                        fill="none"
                        stroke="#51465c"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />
                </svg>
            </div>
        `;
    }


    /* 1マス部屋 */

    if (shape === "one-room") {

        return `
            <div class="shape shape-one-room">
                <div class="room"></div>
            </div>
        `;
    }


    /*
       ★ 1マス部屋＋十字

             十
             □

       十と□を接続
    */

    if (shape === "room-cross") {

        return `
            <div class="shape shape-room-cross">

                <div class="cross"></div>

                <div class="room"></div>

            </div>
        `;
    }


    /*
       ★ 1マス部屋＋ホール

       ┌────────┐
       │        │
       │        │
       └────┬───┘
            □
    */

    if (shape === "room-hall") {

        return `
            <div class="shape shape-room-hall">

                <div class="hall"></div>

                <div class="room"></div>

            </div>
        `;
    }


    /* 1マス＋I字 */

    if (shape === "room-i") {

        return `
            <div class="shape shape-room-i">

                <div class="room"></div>

                <div class="vertical"></div>

            </div>
        `;
    }


    /* 大部屋 */

    if (shape === "large-room") {

        return `
            <div class="shape shape-large-room">
                <div class="room"></div>
            </div>
        `;
    }


    /* 逆L字＋横棒 */

    if (shape === "complex") {

        return `
            <div class="shape shape-complex">

                <svg
                    width="150"
                    height="110"
                    viewBox="0 0 150 110"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            5,82
                            65,82
                            62,18
                            145,18
                        "
                        fill="none"
                        stroke="#51465c"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* Y字状の複合通路 */

    if (shape === "double-reverse-l") {

        return `
            <div class="shape shape-double-reverse-l">

                <svg
                    width="150"
                    height="110"
                    viewBox="0 0 150 110"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            10,75
                            55,75
                            55,45
                            55,15
                        "
                        fill="none"
                        stroke="#51465c"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                    <polyline
                        points="
                            55,45
                            105,45
                            105,85
                        "
                        fill="none"
                        stroke="#51465c"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                    <polyline
                        points="
                            55,45
                            105,45
                            145,45
                        "
                        fill="none"
                        stroke="#51465c"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    return "";
}


/* =====================================================
   判定
===================================================== */

function checkResult() {

    const possiblePatterns =
        patterns.filter(
            pattern =>
                pattern.entrance === currentEntrance
        );

    const matchedPattern =
        possiblePatterns.find(
            pattern => {

                return Object.keys(
                    pattern.conditions
                ).every(
                    direction => {

                        return (
                            answers[direction]
                            ===
                            pattern.conditions[direction]
                        );

                    }
                );

            }
        );


    if (matchedPattern) {

        showResult(
            matchedPattern.location,
            matchedPattern.recommendation
        );

        return;
    }


    /*
       未登録
    */

    hideAllScreens();

    document
        .getElementById("result-location")
        .innerHTML = `

            <div class="not-found">

                ごめんなさい。<br><br>

                この通路の組み合わせは、
                現在登録されていません。<br><br>

                新しいマップが分かったら、
                判定データに追加できます！

            </div>

        `;

    document
        .getElementById("result-recommendation")
        .textContent = "";

    document
        .getElementById("result-warning")
        .textContent =
            "⏰ 時間に気を付けてね！";

    document
        .getElementById("result-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   結果表示
===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();

    document
        .getElementById("result-location")
        .textContent =
            location;

    document
        .getElementById("result-recommendation")
        .textContent =
            recommendation;

    document
        .getElementById("result-warning")
        .textContent =
            "⏰ 時間に気を付けてね！";

    document
        .getElementById("result-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   全画面を隠す
===================================================== */

function hideAllScreens() {

    document
        .getElementById("entrance-screen")
        .classList
        .add("hidden");

    document
        .getElementById("special-screen")
        .classList
        .add("hidden");

    document
        .getElementById("shape-screen")
        .classList
        .add("hidden");

    document
        .getElementById("result-screen")
        .classList
        .add("hidden");
}


/* =====================================================
   最初に戻る
===================================================== */

function goHome() {

    currentEntrance = null;

    answers = {};

    currentDirection = null;

    hideAllScreens();

    document
        .getElementById("entrance-screen")
        .classList
        .remove("hidden");
}
