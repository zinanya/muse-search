<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>

/* ==================================================
   基本
   ================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 12px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7 0%,
            #f1edff 50%,
            #e9f8ff 100%
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}


/* ==================================================
   メインカード
   ================================================== */

.container {
    max-width: 850px;
    margin: 0 auto;

    background:
        rgba(255, 255, 255, 0.95);

    border-radius: 28px;

    padding:
        30px 18px 40px;

    box-shadow:
        0 8px 25px
        rgba(120, 90, 140, 0.15);
}


/* ==================================================
   タイトル
   ================================================== */

h1 {
    font-size: 36px;
    color: #c86fa8;

    margin:
        0 0 10px;

    letter-spacing: 2px;
}

.description {
    font-size: 17px;
    color: #776b80;

    line-height: 1.7;

    margin:
        0 0 30px;
}

h2 {
    font-size: 23px;
    color: #8d76c7;

    margin:
        0 0 22px;

    line-height: 1.5;
}


/* ==================================================
   入口ボタン
   ================================================== */

.entrance-choices {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    max-width: 620px;

    margin: 0 auto;
}

button {
    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    padding:
        18px 12px;

    cursor: pointer;

    box-shadow:
        0 5px 12px
        rgba(150, 110, 170, 0.2);

    transition:
        transform 0.18s,
        box-shadow 0.18s;
}

button:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 8px 16px
        rgba(150, 110, 170, 0.28);
}

button:active {
    transform:
        scale(0.97);
}


/* ==================================================
   パターン選択
   ================================================== */

.pattern-list {
    display: flex;

    flex-direction: column;

    gap: 15px;

    max-width: 780px;

    margin: 0 auto;
}


/* ==================================================
   パターンカード
   ================================================== */

.pattern-card {
    width: 100%;

    padding: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #fffaff,
            #f7f3ff
        );

    border:
        2px solid #eadcf7;

    box-shadow:
        0 4px 12px
        rgba(150, 120, 170, 0.10);

    cursor: pointer;

    transition:
        transform 0.18s,
        border-color 0.18s,
        box-shadow 0.18s;
}

.pattern-card:hover {
    transform:
        translateY(-2px);

    border-color:
        #c9aeea;

    box-shadow:
        0 7px 16px
        rgba(150, 120, 170, 0.18);
}

.pattern-number {
    font-size: 14px;

    color:
        #a88bc9;

    font-weight:
        bold;

    margin-bottom:
        10px;
}


/* ==================================================
   通路3つの横並び
   ================================================== */

.path-row {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    align-items:
        stretch;
}

.path-row.two {
    grid-template-columns:
        repeat(2, 1fr);

    max-width:
        520px;

    margin:
        0 auto;
}


/* ==================================================
   個別通路
   ================================================== */

.path-item {
    min-width: 0;

    padding:
        8px 4px;

    border-radius:
        14px;

    background:
        rgba(255,255,255,0.75);

    border:
        1px solid #eee2f7;
}

.direction {
    font-size:
        13px;

    color:
        #9b83ba;

    font-weight:
        bold;

    margin-bottom:
        3px;
}

.shape-label {
    font-size:
        12px;

    color:
        #776b80;

    line-height:
        1.3;
}


/* ==================================================
   図形
   ================================================== */

.shape {
    position:
        relative;

    width:
        100px;

    height:
        72px;

    margin:
        0 auto 3px;
}

.shape-line {
    position:
        absolute;

    background:
        #4d4055;

    border-radius:
        3px;
}


/* ==================================================
   I字
   ================================================== */

.shape-i .vertical {
    width:
        5px;

    height:
        60px;

    left:
        47px;

    top:
        6px;
}


/* ==================================================
   L字
   ================================================== */

.shape-l .vertical {
    width:
        5px;

    height:
        52px;

    left:
        18px;

    top:
        7px;
}

.shape-l .horizontal {
    width:
        70px;

    height:
        5px;

    left:
        18px;

    bottom:
        7px;
}


/* ==================================================
   逆L字

       │
       │
   ────┘
   ================================================== */

.shape-reverse-l .vertical {
    width:
        5px;

    height:
        52px;

    right:
        18px;

    top:
        7px;
}

.shape-reverse-l .horizontal {
    width:
        74px;

    height:
        5px;

    left:
        5px;

    bottom:
        7px;
}


/* ==================================================
   逆トの字

   ─────┐
        │
        │
   ================================================== */

.shape-reverse-t .vertical {
    width:
        5px;

    height:
        50px;

    right:
        18px;

    top:
        7px;
}

.shape-reverse-t .horizontal {
    width:
        74px;

    height:
        5px;

    left:
        5px;

    top:
        30px;
}


/* ==================================================
   トの字
   ================================================== */

.shape-t .vertical {
    width:
        5px;

    height:
        52px;

    left:
        47px;

    top:
        7px;
}

.shape-t .horizontal {
    width:
        72px;

    height:
        5px;

    left:
        47px;

    top:
        7px;
}


/* ==================================================
   横棒
   ================================================== */

.shape-bar .horizontal {
    width:
        90px;

    height:
        5px;

    left:
        5px;

    top:
        34px;
}


/* ==================================================
   凸
   ================================================== */

.shape-convex svg,
.shape-cross svg,
.shape-complex svg,
.shape-yshape svg {
    width:
        105px;

    height:
        72px;

    display:
        block;

    margin:
        auto;
}


/* ==================================================
   1マス部屋
   ================================================== */

.shape-room {
    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}

.shape-room .corridor {
    position:
        absolute;

    width:
        38px;

    height:
        5px;

    background:
        #4d4055;

    left:
        8px;

    top:
        34px;
}

.shape-room .square {
    position:
        absolute;

    width:
        30px;

    height:
        30px;

    border:
        5px solid #4d4055;

    left:
        45px;

    top:
        20px;

    background:
        #ffffff;
}


/* ==================================================
   1マス部屋＋十字
   ================================================== */

.shape-room-cross svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   1マス＋I字
   ================================================== */

.shape-room-i svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   1マス部屋＋ホール
   ================================================== */

.shape-hall svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   大部屋
   ================================================== */

.shape-large-room {
    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}

.shape-large-room .corridor {
    position:
        absolute;

    width:
        28px;

    height:
        5px;

    left:
        5px;

    top:
        34px;

    background:
        #4d4055;
}

.shape-large-room .room {
    width:
        58px;

    height:
        45px;

    border:
        5px solid #4d4055;

    background:
        white;

    border-radius:
        4px;
}


/* ==================================================
   画像1枚目の特殊形状
   ==================================================

   ──────────┐
              │
              │
        ──────┘
   ================================================== */

.shape-special-1 svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   画像2枚目の特殊形状
   ==================================================

   ──────┐
         │
         └────────
   ================================================== */

.shape-special-2 svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   十字
   ================================================== */

.shape-cross svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   Y字
   ================================================== */

.shape-yshape svg {
    width:
        105px;

    height:
        72px;
}


/* ==================================================
   結果
   ================================================== */

.result {
    padding:
        15px 5px;
}

.result-icon {
    font-size:
        48px;

    margin-bottom:
        5px;
}

.result-title {
    font-size:
        28px;

    font-weight:
        bold;

    color:
        #c86fa8;

    margin-bottom:
        18px;
}

.result-box {
    max-width:
        620px;

    margin:
        0 auto 20px;

    padding:
        23px 18px;

    border-radius:
        22px;

    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );

    border:
        2px solid #eadcf7;
}

.result-location {
    font-size:
        23px;

    font-weight:
        bold;

    color:
        #765fb0;

    line-height:
        1.7;
}

.recommendation {
    margin-top:
        16px;

    padding:
        13px;

    border-radius:
        14px;

    background:
        #fff0f7;

    color:
        #c26d9d;

    font-size:
        17px;

    font-weight:
        bold;

    line-height:
        1.6;
}


/* ==================================================
   時間注意
   ================================================== */

.time-warning {
    margin:
        15px auto 0;

    padding:
        12px 15px;

    max-width:
        520px;

    border-radius:
        14px;

    background:
        linear-gradient(
            135deg,
            #fff4f8,
            #f5efff
        );

    color:
        #8b719d;

    font-size:
        15px;

    font-weight:
        bold;

    line-height:
        1.6;
}


/* ==================================================
   戻る
   ================================================== */

.back-button {
    margin-top:
        18px;

    background:
        #ddd5e5;

    color:
        #655b6b;

    box-shadow:
        none;

    font-size:
        15px;

    padding:
        12px 23px;
}

.back-button:hover {
    background:
        #d2c7dc;

    box-shadow:
        none;
}


/* ==================================================
   未登録
   ================================================== */

.not-found {
    padding:
        25px 10px;

    font-size:
        17px;

    color:
        #776b80;

    line-height:
        1.8;
}


/* ==================================================
   共通
   ================================================== */

.hidden {
    display:
        none;
}


/* ==================================================
   スマホ
   ================================================== */

@media (max-width: 600px) {

    body {
        padding:
            15px 8px;
    }

    .container {
        padding:
            25px 12px 30px;

        border-radius:
            23px;
    }

    h1 {
        font-size:
            29px;
    }

    h2 {
        font-size:
            20px;
    }

    .description {
        font-size:
            15px;
    }

    .entrance-choices {
        grid-template-columns:
            1fr;

        gap:
            12px;
    }

    button {
        font-size:
            17px;

        padding:
            17px 10px;
    }

    .pattern-card {
        padding:
            10px;
    }

    .path-row {
        gap:
            4px;
    }

    .path-item {
        padding:
            6px 2px;
    }

    .shape {
        transform:
            scale(0.82);

        margin:
            -5px auto -5px;
    }

    .direction {
        font-size:
            12px;
    }

    .shape-label {
        font-size:
            10px;
    }

    .result-location {
        font-size:
            20px;
    }

    .result-title {
        font-size:
            25px;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- ==================================================
     入口画面
     ================================================== -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        入口の形を選択すると、<br>
        該当する通路の組み合わせが表示されます。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="entrance-choices">

        <button onclick="selectEntrance('left-center-right')">
            左＋中央＋右
        </button>

        <button onclick="selectEntrance('left-center')">
            左＋中央
        </button>

        <button onclick="selectEntrance('center-right')">
            中央＋右
        </button>

        <button onclick="selectEntrance('left-right')">
            左＋右
        </button>

    </div>

</div>


<!-- ==================================================
     パターン選択画面
     ================================================== -->

<div id="pattern-screen" class="hidden">

    <h2 id="pattern-question">
    </h2>

    <p class="description">
        実際の通路と同じ組み合わせを選択してください。
    </p>

    <div
        id="pattern-list"
        class="pattern-list"
    >
    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- ==================================================
     結果画面
     ================================================== -->

<div id="result-screen" class="hidden">

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            >
            </div>

            <div
                id="result-recommendation"
                class="recommendation"
            >
            </div>

            <div class="time-warning">
                ⏰ 時間に気を付けてね！<br>
                できるだけ早めにミューズ部屋へ向かおう。
            </div>

        </div>

        <button onclick="goHome()">
            もう一度検索する
        </button>

    </div>

</div>


</div>


<script>

/* =====================================================
   ★★★★★ 判定データ ★★★★★

   新しいマップを追加するときは、
   基本的にこの配列に1件追加するだけ！

   entrance:
       left-center-right
       left-center
       center-right
       left-right

   conditions:
       left
       center
       right

   shape:
       図形のID

   location:
       ミューズの場所

   recommendation:
       おすすめルート
   ===================================================== */


const patterns = [

    /* =================================================
       ① 左＋中央＋右

       左 → I字
       中央 → 1マス部屋
       右 → L字

       ミューズ → 右側
       おすすめ → 中央から右
       ================================================= */

    {
        id: 1,

        entrance:
            "left-center-right",

        conditions: {
            left:
                "i",

            center:
                "room",

            right:
                "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から右に進むのがおすすめです！"
    },


    /* =================================================
       ② 左＋中央＋右

       左 → 横棒
       中央 → 1マス部屋
       右 → トの字

       ミューズ → 中央奥
       おすすめ → 中央からやや左
       ================================================= */

    {
        id: 2,

        entrance:
            "left-center-right",

        conditions: {
            left:
                "bar",

            center:
                "room",

            right:
                "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、やや左に向かうのがおすすめです！"
    },


    /* =================================================
       ③ 左＋中央＋右

       左 → 逆L字
       中央 → 1マス部屋＋十字
       右 → L字

       ミューズ → 右奥
       おすすめ → 中央から右
       ================================================= */

    {
        id: 3,

        entrance:
            "left-center-right",

        conditions: {
            left:
                "reverse-l",

            center:
                "room-cross",

            right:
                "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右側に向かうのがおすすめです！"
    },


    /* =================================================
       ④ 左＋中央

       左 → すぐに部屋
       中央 → 1マス部屋＋ホール

       ミューズ → 左側
       おすすめ → 左
       ================================================= */

    {
        id: 4,

        entrance:
            "left-center",

        conditions: {
            left:
                "room-immediate",

            center:
                "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "⭐ 左に入って、すぐに部屋があるなら確定です！"
    },


    /* =================================================
       ⑤ 左＋中央

       左 → L字
       中央 → 1マス＋I字

       ミューズ → 中央奥
       おすすめ → 中央
       ================================================= */

    {
        id: 5,

        entrance:
            "left-center",

        conditions: {
            left:
                "l",

            center:
                "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！ 階段のある通路は通り抜けてね。"
    },


    /* =================================================
       ⑥ 中央＋右

       中央 → 1マス部屋＋十字
       右 → 特殊形状（画像1）

       ミューズ → 中央奥
       おすすめ → 中央からY字路を左
       ================================================= */

    {
        id: 6,

        entrance:
            "center-right",

        conditions: {
            center:
                "room-cross",

            right:
                "special-1"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },


    /* =================================================
       ⑦ 中央＋右

       中央 → 1マス部屋＋十字
       右 → 大部屋

       ミューズ → 中央奥
       ================================================= */

    {
        id: 7,

        entrance:
            "center-right",

        conditions: {
            center:
                "room-cross",

            right:
                "large-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！"
    },


    /* =================================================
       ⑧ 中央＋右

       中央 → 1マス＋十字
       右 → 凸

       ミューズ → 中央奥やや右
       ================================================= */

    {
        id: 8,

        entrance:
            "center-right",

        conditions: {
            center:
                "room-cross",

            right:
                "convex"
        },

        location:
            "中央奥やや右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右を目指すのがおすすめです！"
    },


    /* =================================================
       ⑨ 左＋右

       左 → 逆トの字
       右 → 逆L字

       ミューズ → 右側
       ================================================= */

    {
        id: 9,

        entrance:
            "left-right",

        conditions: {
            left:
                "reverse-t",

            right:
                "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進み、突き当りで左に進むのがおすすめです！"
    },


    /* =================================================
       ⑩ 左＋右

       左 → 逆L字
       右 → 特殊形状（画像2）

       ミューズ → 右側
       ================================================= */

    {
        id: 10,

        entrance:
            "left-right",

        conditions: {
            left:
                "reverse-l",

            right:
                "special-2"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進むのがおすすめです！"
    }

];



/* =====================================================
   図形名
   ===================================================== */

const shapeNames = {

    i:
        "I字",

    l:
        "L字",

    "reverse-l":
        "逆L字",

    "reverse-t":
        "逆トの字",

    t:
        "トの字",

    bar:
        "横棒",

    room:
        "1マス部屋",

    "room-cross":
        "1マス部屋＋十字",

    "room-i":
        "1マス＋I字",

    "room-hall":
        "1マス部屋＋ホール",

    "room-immediate":
        "入ってすぐ部屋",

    "large-room":
        "大部屋",

    convex:
        "凸の字",

    "special-1":
        "特殊通路",

    "special-2":
        "特殊通路"

};



/* =====================================================
   入口名
   ===================================================== */

const entranceNames = {

    "left-center-right":
        "左＋中央＋右",

    "left-center":
        "左＋中央",

    "center-right":
        "中央＋右",

    "left-right":
        "左＋右"

};



/* =====================================================
   状態
   ===================================================== */

let currentEntrance =
    null;



/* =====================================================
   入口選択
   ===================================================== */

function selectEntrance(
    entrance
) {

    currentEntrance =
        entrance;

    hideAllScreens();

    showPatterns();

}



/* =====================================================
   パターンを一括表示
   ===================================================== */

function showPatterns() {

    const list =
        document.getElementById(
            "pattern-list"
        );

    list.innerHTML =
        "";



    document.getElementById(
        "pattern-question"
    ).textContent =
        `② ${entranceNames[currentEntrance]}の通路の組み合わせを選択してください`;



    const availablePatterns =
        patterns.filter(
            pattern =>
                pattern.entrance ===
                currentEntrance
        );



    if (
        availablePatterns.length ===
        0
    ) {

        list.innerHTML = `

            <div class="not-found">

                現在、この入口のパターンは
                登録されていません。

            </div>

        `;

        document
            .getElementById(
                "pattern-screen"
            )
            .classList
            .remove("hidden");

        return;
    }



    availablePatterns.forEach(
        pattern => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "pattern-card";

            card.onclick =
                function() {

                    showResult(
                        pattern.location,
                        pattern.recommendation
                    );

                };



            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "pattern-number";

            number.textContent =
                `組み合わせ ${pattern.id}`;

            card.appendChild(
                number
            );



            const row =
                document.createElement(
                    "div"
                );



            const directions =
                getDirections(
                    currentEntrance
                );



            row.className =
                directions.length === 2
                    ? "path-row two"
                    : "path-row";



            directions.forEach(
                direction => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "path-item";



                    const directionName =
                        document.createElement(
                            "div"
                        );

                    directionName.className =
                        "direction";

                    directionName.textContent =
                        directionNames[
                            direction
                        ];



                    const shape =
                        document.createElement(
                            "div"
                        );

                    shape.innerHTML =
                        createShapeHTML(
                            pattern.conditions[
                                direction
                            ]
                        );



                    const label =
                        document.createElement(
                            "div"
                        );

                    label.className =
                        "shape-label";

                    label.textContent =
                        shapeNames[
                            pattern.conditions[
                                direction
                            ]
                        ];



                    item.appendChild(
                        directionName
                    );

                    item.appendChild(
                        shape
                    );

                    item.appendChild(
                        label
                    );



                    row.appendChild(
                        item
                    );

                }
            );



            card.appendChild(
                row
            );



            list.appendChild(
                card
            );

        }
    );



    document
        .getElementById(
            "pattern-screen"
        )
        .classList
        .remove("hidden");

}



/* =====================================================
   方向
   ===================================================== */

const directionNames = {

    left:
        "左",

    center:
        "中央",

    right:
        "右"

};



function getDirections(
    entrance
) {

    if (
        entrance ===
        "left-center-right"
    ) {

        return [
            "left",
            "center",
            "right"
        ];

    }



    if (
        entrance ===
        "left-center"
    ) {

        return [
            "left",
            "center"
        ];

    }



    if (
        entrance ===
        "center-right"
    ) {

        return [
            "center",
            "right"
        ];

    }



    if (
        entrance ===
        "left-right"
    ) {

        return [
            "left",
            "right"
        ];

    }



    return [];

}



/* =====================================================
   図形HTML
   ===================================================== */

function createShapeHTML(
    shape
) {


    /* ================================================
       I字
       ================================================ */

    if (
        shape === "i"
    ) {

        return `

            <div class="shape shape-i">

                <div
                    class="shape-line vertical">
                </div>

            </div>

        `;

    }



    /* ================================================
       L字
       ================================================ */

    if (
        shape === "l"
    ) {

        return `

            <div class="shape shape-l">

                <div
                    class="shape-line vertical">
                </div>

                <div
                    class="shape-line horizontal">
                </div>

            </div>

        `;

    }



    /* ================================================
       逆L字
       ================================================ */

    if (
        shape === "reverse-l"
    ) {

        return `

            <div class="shape shape-reverse-l">

                <div
                    class="shape-line vertical">
                </div>

                <div
                    class="shape-line horizontal">
                </div>

            </div>

        `;

    }



    /* ================================================
       逆トの字
       ================================================ */

    if (
        shape === "reverse-t"
    ) {

        return `

            <div class="shape shape-reverse-t">

                <div
                    class="shape-line vertical">
                </div>

                <div
                    class="shape-line horizontal">
                </div>

            </div>

        `;

    }



    /* ================================================
       トの字
       ================================================ */

    if (
        shape === "t"
    ) {

        return `

            <div class="shape shape-t">

                <div
                    class="shape-line vertical">
                </div>

                <div
                    class="shape-line horizontal">
                </div>

            </div>

        `;

    }



    /* ================================================
       横棒
       ================================================ */

    if (
        shape === "bar"
    ) {

        return `

            <div class="shape shape-bar">

                <div
                    class="shape-line horizontal">
                </div>

            </div>

        `;

    }



    /* ================================================
       1マス部屋
       ================================================ */

    if (
        shape === "room"
    ) {

        return `

            <div class="shape shape-room">

                <div class="corridor"></div>

                <div class="square"></div>

            </div>

        `;

    }



    /* ================================================
       1マス部屋＋十字
       ================================================ */

    if (
        shape === "room-cross"
    ) {

        return `

            <div class="shape shape-room-cross">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            8,36
                            35,36
                            35,18
                            52,18
                            52,5
                            52,67
                            52,54
                            70,54
                            70,36
                            97,36
                        "
                        fill="none"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <rect
                        x="20"
                        y="27"
                        width="18"
                        height="18"
                        fill="white"
                        stroke="#4d4055"
                        stroke-width="4"
                    />

                </svg>

            </div>

        `;

    }



    /* ================================================
       1マス＋I字
       ================================================ */

    if (
        shape === "room-i"
    ) {

        return `

            <div class="shape shape-room-i">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <line
                        x1="8"
                        y1="36"
                        x2="38"
                        y2="36"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <rect
                        x="34"
                        y="27"
                        width="18"
                        height="18"
                        fill="white"
                        stroke="#4d4055"
                        stroke-width="4"
                    />

                    <line
                        x1="61"
                        y1="8"
                        x2="61"
                        y2="64"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

        `;

    }



    /* ================================================
       1マス部屋＋ホール
       ================================================ */

    if (
        shape === "room-hall"
    ) {

        return `

            <div class="shape shape-hall">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <line
                        x1="5"
                        y1="36"
                        x2="28"
                        y2="36"
                        stroke="#4d4055"
                        stroke-width="5"
                    />

                    <rect
                        x="24"
                        y="27"
                        width="18"
                        height="18"
                        fill="white"
                        stroke="#4d4055"
                        stroke-width="4"
                    />

                    <rect
                        x="50"
                        y="13"
                        width="48"
                        height="46"
                        rx="4"
                        fill="white"
                        stroke="#4d4055"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;

    }



    /* ================================================
       すぐに部屋
       ================================================ */

    if (
        shape === "room-immediate"
    ) {

        return `

            <div class="shape shape-large-room">

                <div
                    class="corridor">
                </div>

                <div
                    class="room">
                </div>

            </div>

        `;

    }



    /* ================================================
       大部屋
       ================================================ */

    if (
        shape === "large-room"
    ) {

        return `

            <div class="shape shape-large-room">

                <div
                    class="corridor">
                </div>

                <div
                    class="room">
                </div>

            </div>

        `;

    }



    /* ================================================
       凸の字
       ================================================ */

    if (
        shape === "convex"
    ) {

        return `

            <div class="shape shape-convex">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            7,60
                            7,30
                            31,30
                            36,12
                            68,12
                            73,30
                            98,30
                            98,60
                            7,60
                        "
                        fill="none"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

        `;

    }



    /* ================================================
       特殊形状①

       送ってもらった1枚目を参考

       ───────┐
              │
       ──────┼────
                  │
                  │
       ================================================ */

    if (
        shape === "special-1"
    ) {

        return `

            <div class="shape shape-special-1">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            2,35
                            42,35
                            45,8
                        "
                        fill="none"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <polyline
                        points="
                            45,35
                            100,35
                        "
                        fill="none"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                    <line
                        x1="72"
                        y1="38"
                        x2="72"
                        y2="67"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

        `;

    }



    /* ================================================
       特殊形状②

       送ってもらった2枚目を参考

       ─────┐
             │
             └────────

       ================================================ */

    if (
        shape === "special-2"
    ) {

        return `

            <div class="shape shape-special-2">

                <svg
                    viewBox="0 0 105 72"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            5,55
                            38,55
                            42,14
                            100,14
                        "
                        fill="none"
                        stroke="#4d4055"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

        `;

    }



    return "";

}



/* =====================================================
   結果表示
   ===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();



    document
        .getElementById(
            "result-location"
        )
        .textContent =
            location;



    document
        .getElementById(
            "result-recommendation"
        )
        .textContent =
            recommendation;



    document
        .getElementById(
            "result-screen"
        )
        .classList
        .remove("hidden");

}



/* =====================================================
   全画面を隠す
   ===================================================== */

function hideAllScreens() {

    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .add("hidden");



    document
        .getElementById(
            "pattern-screen"
        )
        .classList
        .add("hidden");



    document
        .getElementById(
            "result-screen"
        )
        .classList
        .add("hidden");

}



/* =====================================================
   最初に戻る
   ===================================================== */

function goHome() {

    currentEntrance =
        null;



    hideAllScreens();



    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .remove("hidden");

}

</script>

</body>
