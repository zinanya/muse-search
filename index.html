<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f1edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}

.container {
    max-width: 850px;
    margin: 0 auto;

    background: rgba(255,255,255,0.95);

    border-radius: 30px;

    padding: 32px 22px 42px;

    box-shadow:
        0 8px 25px rgba(120,90,140,0.15);
}

h1 {
    font-size: 38px;
    color: #c86fa8;
    margin: 0 0 12px;
    letter-spacing: 2px;
}

.description {
    font-size: 17px;
    color: #776b80;
    line-height: 1.8;
    margin-bottom: 30px;
}

h2 {
    font-size: 24px;
    color: #8d76c7;
    margin: 0 0 24px;
    line-height: 1.5;
}

/* =========================
   共通ボタン
========================= */

button {
    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(150,110,170,0.2);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 16px rgba(150,110,170,0.28);
}

button:active {
    transform: scale(0.97);
}

.choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;

    max-width: 650px;
    margin: 0 auto;
}

.entrance-button {
    padding: 21px 12px;
}

/* =========================
   YES / NO
========================= */

.yes-no {
    max-width: 500px;
}

.yes {
    background:
        linear-gradient(
            135deg,
            #f5a5c9,
            #e68eb9
        );
}

.no {
    background:
        linear-gradient(
            135deg,
            #aeb5ec,
            #8f91d8
        );
}

/* =========================
   一括表示
========================= */

.pattern-list {
    display: flex;
    flex-direction: column;
    gap: 18px;

    max-width: 760px;
    margin: 0 auto;
}

.pattern-card {
    width: 100%;

    padding: 18px 15px 20px;

    background:
        linear-gradient(
            135deg,
            #fffafd,
            #f8f5ff
        );

    border: 2px solid #e4d7f3;

    border-radius: 22px;

    box-shadow:
        0 4px 12px rgba(150,120,170,0.10);

    cursor: pointer;

    transition: 0.2s;
}

.pattern-card:hover {
    transform: translateY(-2px);

    border-color: #c9aeea;

    box-shadow:
        0 7px 17px rgba(150,120,170,0.17);
}

.pattern-number {
    font-size: 17px;
    font-weight: bold;
    color: #a477c0;

    margin-bottom: 13px;
}

.route-preview {
    display: flex;

    justify-content: center;
    align-items: stretch;

    gap: 10px;

    flex-wrap: wrap;
}

.route-part {
    flex: 1 1 170px;
    min-width: 145px;

    padding: 10px 7px 8px;

    background: rgba(255,255,255,0.78);

    border-radius: 15px;

    border: 1px solid #eee3f7;
}

.route-label {
    font-size: 14px;
    font-weight: bold;

    color: #8d76c7;

    margin-bottom: 3px;
}

.route-shape-name {
    font-size: 13px;
    color: #776b80;

    margin-top: 2px;
}

.click-hint {
    margin-top: 12px;

    font-size: 13px;
    color: #b27aaa;
}

/* =========================
   図形
========================= */

.shape {
    position: relative;

    width: 120px;
    height: 80px;

    margin: 0 auto;
}

.shape-line {
    position: absolute;

    background: #8f79b8;

    border-radius: 3px;
}

/* I字 */

.shape-i .vertical {
    width: 5px;
    height: 68px;

    left: 57px;
    top: 5px;
}

/* L字 └ */

.shape-l .vertical {
    width: 5px;
    height: 62px;

    left: 20px;
    top: 5px;
}

.shape-l .horizontal {
    width: 85px;
    height: 5px;

    left: 20px;
    bottom: 8px;
}

/* 逆L字 ┘ */

.shape-reverse-l .vertical {
    width: 5px;
    height: 62px;

    right: 20px;
    top: 5px;
}

.shape-reverse-l .horizontal {
    width: 85px;
    height: 5px;

    left: 15px;
    bottom: 8px;
}

/* 逆トの字 ┐ */

.shape-reverse-t .vertical {
    width: 5px;
    height: 65px;

    right: 20px;
    top: 5px;
}

.shape-reverse-t .horizontal {
    width: 85px;
    height: 5px;

    left: 15px;
    top: 32px;
}

/* トの字 ┌ */

.shape-t .vertical {
    width: 5px;
    height: 65px;

    left: 20px;
    top: 5px;
}

.shape-t .horizontal {
    width: 85px;
    height: 5px;

    left: 20px;
    top: 32px;
}

/* 横棒 */

.shape-horizontal .horizontal {
    width: 105px;
    height: 5px;

    left: 7px;
    top: 38px;
}

/* =========================
   1マス部屋
========================= */

.shape-room {
    display: flex;

    align-items: center;
    justify-content: center;
}

.room-box {
    width: 28px;
    height: 28px;

    border: 4px solid #8f79b8;
    border-radius: 4px;
}

/* =========================
   1マス部屋＋十字
========================= */

.shape-room-cross {
    position: relative;

    width: 120px;
    height: 90px;

    margin: 0 auto;
}

.cross-line {
    position: absolute;

    background: #8f79b8;

    border-radius: 3px;
}

.cross-horizontal {
    width: 70px;
    height: 5px;

    left: 25px;
    top: 25px;
}

.cross-vertical {
    width: 5px;
    height: 70px;

    left: 57px;
    top: 10px;
}

.cross-room {
    position: absolute;

    width: 25px;
    height: 25px;

    left: 45px;
    bottom: 0;

    border: 4px solid #8f79b8;

    border-radius: 3px;

    background: #fff;
}

/* =========================
   1マス部屋＋I字
========================= */

.shape-room-i {
    position: relative;

    width: 120px;
    height: 90px;

    margin: 0 auto;
}

.room-i-line {
    position: absolute;

    width: 5px;
    height: 52px;

    left: 58px;
    top: 5px;

    background: #8f79b8;

    border-radius: 3px;
}

.room-i-box {
    position: absolute;

    width: 25px;
    height: 25px;

    left: 45px;
    bottom: 3px;

    border: 4px solid #8f79b8;

    border-radius: 3px;

    background: #fff;
}

/* =========================
   1マス部屋＋ホール
========================= */

.shape-room-hall {
    position: relative;

    width: 135px;
    height: 90px;

    margin: 0 auto;
}

.hall {
    position: absolute;

    left: 10px;
    top: 8px;

    width: 115px;
    height: 65px;

    border: 5px solid #8f79b8;

    border-radius: 5px;
}

.hall-room {
    position: absolute;

    width: 25px;
    height: 25px;

    left: 55px;
    bottom: -1px;

    border: 4px solid #8f79b8;

    border-radius: 3px;

    background: white;
}

/* =========================
   凸
========================= */

.shape-convex svg,
.shape-complex svg,
.shape-big-room svg,
.shape-special-right svg {
    width: 125px;
    height: 85px;
}

/* =========================
   結果
========================= */

.result {
    padding: 15px 10px;
}

.result-icon {
    font-size: 48px;
    margin-bottom: 5px;
}

.result-title {
    font-size: 28px;
    color: #c86fa8;
    margin-bottom: 18px;
    font-weight: bold;
}

.result-box {
    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );

    border-radius: 22px;

    padding: 22px 18px;

    margin: 18px auto;

    max-width: 600px;
}

.result-location {
    font-size: 22px;

    font-weight: bold;

    color: #765fb0;

    line-height: 1.7;
}

.recommendation {
    margin-top: 16px;

    font-size: 17px;

    font-weight: bold;

    color: #c26d9d;

    line-height: 1.7;
}

.warning {
    margin-top: 15px;

    padding: 13px 15px;

    border-radius: 14px;

    background: #fff1f7;

    color: #a75f88;

    font-size: 15px;

    font-weight: bold;
}

.not-found {
    font-size: 17px;

    line-height: 1.8;

    color: #776b80;
}

.back-button {
    margin-top: 22px;

    background: #ddd5e5;

    color: #655b6b;

    box-shadow: none;

    font-size: 15px;

    padding: 12px 24px;
}

.back-button:hover {
    background: #d2c7dc;

    box-shadow: none;
}

/* =========================
   非表示
========================= */

.hidden {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    .container {
        padding: 27px 13px 35px;
        border-radius: 25px;
    }

    h1 {
        font-size: 30px;
    }

    h2 {
        font-size: 21px;
    }

    .description {
        font-size: 15px;
    }

    .choices {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .entrance-button {
        font-size: 17px;
        padding: 18px 10px;
    }

    .route-part {
        min-width: 120px;
    }

    .pattern-card {
        padding: 15px 9px;
    }

    .shape {
        transform: scale(0.88);
        margin-top: -4px;
        margin-bottom: -4px;
    }

    .shape-room-cross,
    .shape-room-i,
    .shape-room-hall {
        transform: scale(0.88);
        margin-top: -4px;
        margin-bottom: -4px;
    }

    .result-title {
        font-size: 24px;
    }

    .result-location {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     入口選択
========================= -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        入口の形を選択して、<br>
        通路の組み合わせからミューズの位置を特定します。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="choices">

        <button
            class="entrance-button"
            onclick="selectEntrance('left-center-right')"
        >
            左＋中央＋右
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('left-center')"
        >
            左＋中央
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('center-right')"
        >
            中央＋右
        </button>

        <button
            class="entrance-button"
            onclick="selectEntrance('left-right')"
        >
            左＋右
        </button>

    </div>

</div>


<!-- =========================
     特殊条件
========================= -->

<div
    id="special-screen"
    class="hidden"
>

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>

    <p class="description">
        「左＋中央」の入口の場合のみ確認します。
    </p>

    <div class="choices yes-no">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>

        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 戻る
    </button>

</div>


<!-- =========================
     一括候補表示
========================= -->

<div
    id="pattern-screen"
    class="hidden"
>

    <h2 id="pattern-question"></h2>

    <p class="description">
        下の中から、実際の通路と一致する組み合わせを選んでください。
    </p>

    <div
        id="pattern-list"
        class="pattern-list"
    ></div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- =========================
     結果
========================= -->

<div
    id="result-screen"
    class="hidden"
>

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            ></div>

            <div
                id="result-recommendation"
                class="recommendation"
            ></div>

            <div class="warning">
                ⏰ 時間に気を付けて進んでね！
            </div>

        </div>

        <button
            onclick="goHome()"
            style="padding:17px 25px;"
        >
            もう一度検索する
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   ★ 判定データ ★

   新しいマップを追加するときは、
   この配列にデータを追加するだけ。

   ===================================================== */

const patterns = [

    /* ================================
       ① 左＋中央＋右

       L → I字
       C → 1マス部屋
       R → L字

       ミューズ → 右側
       おすすめ → 中央から右
    ================================= */

    {
        entrance: "left-center-right",

        conditions: {
            left: "i",
            center: "room",
            right: "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から右に向かって進むのがおすすめです！"
    },


    /* ================================
       ② 左＋中央＋右

       L → 横棒
       C → 1マス部屋
       R → トの字

       ミューズ → 中央奥
    ================================= */

    {
        entrance: "left-center-right",

        conditions: {
            left: "horizontal",
            center: "room",
            right: "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、やや左に向かうのがおすすめです！"
    },


    /* ================================
       ③ 左＋中央＋右

       L → 逆L字
       C → 1マス部屋＋十字
       R → L字

       ミューズ → 右奥
    ================================= */

    {
        entrance: "left-center-right",

        conditions: {
            left: "reverse-l",
            center: "room-cross",
            right: "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右側に向かうのがおすすめです！"
    },


    /* ================================
       ④ 左＋中央

       L → すぐに部屋
       C → 1マス部屋＋ホール

       ミューズ → 左

       特殊条件で確定
    ================================= */

    {
        entrance: "left-center",

        conditions: {
            left: "room-immediate",
            center: "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "⭐ 左に入ってすぐに部屋があるなら、左側へ進むのがおすすめです！"
    },


    /* ================================
       ⑤ 左＋中央

       L → L字
       C → 1マス＋I字

       ミューズ → 中央奥
    ================================= */

    {
        entrance: "left-center",

        conditions: {
            left: "l",
            center: "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです。階段のある通路は通り抜けてね！"
    },


    /* ================================
       ⑥ 中央＋右

       C → 1マス部屋＋十字
       R → 特殊形状

       ミューズ → 中央奥
    ================================= */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "special-right"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },


    /* ================================
       ⑦ 中央＋右

       C → 1マス部屋＋十字
       R → 大部屋

       ミューズ → 中央奥
    ================================= */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "big-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！"
    },


    /* ================================
       ⑧ 中央＋右

       C → 1マス＋十字
       R → 凸

       ミューズ → 中央奥やや右
    ================================= */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "convex"
        },

        location:
            "中央奥、やや右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右を目指すのがおすすめです！"
    },


    /* ================================
       ⑨ 左＋右

       L → 逆トの字
       R → 逆L字

       ミューズ → 右
    ================================= */

    {
        entrance: "left-right",

        conditions: {
            left: "reverse-t",
            right: "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進み、突き当りで左に進むのがおすすめです！"
    },


    /* ================================
       ⑩ 左＋右

       L → 逆L字
       R → 特殊形状

       ミューズ → 右
    ================================= */

    {
        entrance: "left-right",

        conditions: {
            left: "reverse-l",
            right: "complex-right"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進むのがおすすめです！"
    }

];


/* =====================================================
   図形名
===================================================== */

const shapeNames = {

    i:
        "I字",

    l:
        "L字",

    "reverse-l":
        "逆L字",

    "reverse-t":
        "逆トの字",

    t:
        "トの字",

    horizontal:
        "横棒",

    room:
        "1マス部屋",

    "room-cross":
        "1マス部屋＋十字",

    "room-i":
        "1マス部屋＋I字",

    "room-hall":
        "1マス部屋＋ホール",

    "room-immediate":
        "入ってすぐ部屋",

    convex:
        "凸の字",

    "special-right":
        "Y字状の特殊通路",

    "big-room":
        "大部屋",

    "complex-right":
        "特殊通路"
};


/* =====================================================
   状態
===================================================== */

let currentEntrance = null;


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(entrance) {

    currentEntrance = entrance;

    hideAllScreens();

    /*
     * 「左＋中央」の場合だけ、
     * 先に特殊条件を確認する。
     */
    if (entrance === "left-center") {

        document
            .getElementById("special-screen")
            .classList
            .remove("hidden");

        return;
    }

    showPatterns();
}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(hasRoom) {

    /*
     * 左に入ってすぐ部屋がある場合、
     * 左側にミューズが確定。
     */

    if (hasRoom) {

        showResult(
            "左側にミューズ部屋があります！",
            "⭐ 左に入ってすぐに部屋があるなら、左側へ進むのがおすすめです！"
        );

        return;
    }

    /*
     * 「いいえ」なら通常の候補一覧へ。
     */

    showPatterns();
}


/* =====================================================
   現在の入口に存在するパターンだけ取得
===================================================== */

function getPatternsForEntrance() {

    return patterns.filter(
        pattern =>
            pattern.entrance === currentEntrance
    );
}


/* =====================================================
   一括表示
===================================================== */

function showPatterns() {

    hideAllScreens();

    const entranceNames = {

        "left-center-right":
            "左＋中央＋右",

        "left-center":
            "左＋中央",

        "center-right":
            "中央＋右",

        "left-right":
            "左＋右"
    };


    document
        .getElementById("pattern-question")
        .textContent =
        `② ${entranceNames[currentEntrance]}の通路を確認してください`;


    const list =
        document.getElementById("pattern-list");

    list.innerHTML = "";


    const currentPatterns =
        getPatternsForEntrance();


    /*
     * 登録されている組み合わせを
     * すべて一度に表示。
     */

    currentPatterns.forEach(
        (pattern, index) => {

            const card =
                document.createElement("div");

            card.className =
                "pattern-card";


            const number =
                document.createElement("div");

            number.className =
                "pattern-number";

            number.textContent =
                `候補 ${index + 1}`;


            const preview =
                document.createElement("div");

            preview.className =
                "route-preview";


            /*
             * 表示順は
             * 左 → 中央 → 右
             */

            const directions = [];

            if (pattern.conditions.left) {
                directions.push("left");
            }

            if (pattern.conditions.center) {
                directions.push("center");
            }

            if (pattern.conditions.right) {
                directions.push("right");
            }


            const directionNames = {

                left:
                    "左",

                center:
                    "中央",

                right:
                    "右"
            };


            directions.forEach(
                direction => {

                    const part =
                        document.createElement("div");

                    part.className =
                        "route-part";


                    const label =
                        document.createElement("div");

                    label.className =
                        "route-label";

                    label.textContent =
                        directionNames[direction];


                    const shape =
                        document.createElement("div");

                    shape.innerHTML =
                        createShapeHTML(
                            pattern.conditions[direction]
                        );


                    const name =
                        document.createElement("div");

                    name.className =
                        "route-shape-name";

                    name.textContent =
                        shapeNames[
                            pattern.conditions[direction]
                        ];


                    part.appendChild(label);
                    part.appendChild(shape);
                    part.appendChild(name);

                    preview.appendChild(part);

                }
            );


            const hint =
                document.createElement("div");

            hint.className =
                "click-hint";

            hint.textContent =
                "この組み合わせなら、タップして結果を見る";


            card.appendChild(number);
            card.appendChild(preview);
            card.appendChild(hint);


            card.onclick =
                function() {

                    showResult(
                        pattern.location,
                        pattern.recommendation
                    );

                };


            list.appendChild(card);

        }
    );


    document
        .getElementById("pattern-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   図形HTML
===================================================== */

function createShapeHTML(shape) {


    /* =========================
       I字
    ========================= */

    if (shape === "i") {

        return `
            <div class="shape shape-i">
                <div class="shape-line vertical"></div>
            </div>
        `;
    }


    /* =========================
       L字
    ========================= */

    if (shape === "l") {

        return `
            <div class="shape shape-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* =========================
       逆L字
    ========================= */

    if (shape === "reverse-l") {

        return `
            <div class="shape shape-reverse-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* =========================
       逆トの字
    ========================= */

    if (shape === "reverse-t") {

        return `
            <div class="shape shape-reverse-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* =========================
       トの字
    ========================= */

    if (shape === "t") {

        return `
            <div class="shape shape-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* =========================
       横棒
    ========================= */

    if (shape === "horizontal") {

        return `
            <div class="shape shape-horizontal">
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* =========================
       1マス部屋
    ========================= */

    if (shape === "room") {

        return `
            <div class="shape shape-room">
                <div class="room-box"></div>
            </div>
        `;
    }


    /* =========================
       1マス部屋＋十字

       十
       □
       ↑

       というイメージ
    ========================= */

    if (shape === "room-cross") {

        return `
            <div class="shape-room-cross">

                <div class="cross-line cross-horizontal"></div>

                <div class="cross-line cross-vertical"></div>

                <div class="cross-room"></div>

            </div>
        `;
    }


    /* =========================
       1マス部屋＋I字
    ========================= */

    if (shape === "room-i") {

        return `
            <div class="shape-room-i">

                <div class="room-i-line"></div>

                <div class="room-i-box"></div>

            </div>
        `;
    }


    /* =========================
       1マス部屋＋ホール
    ========================= */

    if (shape === "room-hall") {

        return `
            <div class="shape-room-hall">

                <div class="hall"></div>

                <div class="hall-room"></div>

            </div>
        `;
    }


    /* =========================
       凸
    ========================= */

    if (shape === "convex") {

        return `
            <div class="shape shape-convex">

                <svg
                    viewBox="0 0 180 120"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            10,95
                            10,55
                            65,55
                            65,20
                            115,20
                            115,55
                            170,55
                            170,95
                            10,95
                        "
                        fill="none"
                        stroke="#8f79b8"
                        stroke-width="6"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* =========================
       中央＋右用 特殊通路
    ========================= */

    if (shape === "special-right") {

        return `
            <div class="shape shape-special-right">

                <svg
                    viewBox="0 0 180 120"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            15,100
                            15,60
                            75,60
                            75,25
                            105,25
                            105,60
                            165,60
                        "
                        fill="none"
                        stroke="#8f79b8"
                        stroke-width="6"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* =========================
       大部屋
    ========================= */

    if (shape === "big-room") {

        return `
            <div class="shape shape-big-room">

                <svg
                    viewBox="0 0 180 120"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        x="25"
                        y="15"
                        width="130"
                        height="80"
                        rx="5"
                        fill="white"
                        stroke="#8f79b8"
                        stroke-width="6"
                    />

                </svg>

            </div>
        `;
    }


    /* =========================
       左＋右 ⑩の特殊通路
    ========================= */

    if (shape === "complex-right") {

        return `
            <div class="shape shape-complex">

                <svg
                    viewBox="0 0 180 120"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            10,95
                            75,95
                            75,25
                            165,25
                        "
                        fill="none"
                        stroke="#8f79b8"
                        stroke-width="6"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    return "";
}


/* =====================================================
   結果表示
===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();


    document
        .getElementById("result-location")
        .textContent =
        location;


    document
        .getElementById("result-recommendation")
        .textContent =
        recommendation;


    document
        .getElementById("result-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   全画面を隠す
===================================================== */

function hideAllScreens() {

    document
        .getElementById("entrance-screen")
        .classList
        .add("hidden");


    document
        .getElementById("special-screen")
        .classList
        .add("hidden");


    document
        .getElementById("pattern-screen")
        .classList
        .add("hidden");


    document
        .getElementById("result-screen")
        .classList
        .add("hidden");
}


/* =====================================================
   最初に戻る
===================================================== */

function goHome() {

    currentEntrance = null;

    hideAllScreens();

    document
        .getElementById("entrance-screen")
        .classList
        .remove("hidden");
}
