<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f1edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}

.container {
    max-width: 760px;
    margin: 0 auto;

    background: rgba(255,255,255,0.96);

    border-radius: 30px;

    padding: 32px 22px 40px;

    box-shadow:
        0 8px 25px rgba(120,90,140,0.15);
}

h1 {
    font-size: 36px;
    color: #c86fa8;
    margin: 0 0 12px;
    letter-spacing: 2px;
}

.description {
    font-size: 17px;
    color: #776b80;
    line-height: 1.8;
    margin-bottom: 30px;
}

h2 {
    font-size: 24px;
    color: #8d76c7;
    margin: 0 0 22px;
    line-height: 1.5;
}

.choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    max-width: 600px;
    margin: 0 auto;
}

button {
    padding: 18px 12px;

    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(150,110,170,0.18);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 16px rgba(150,110,170,0.25);
}

button:active {
    transform: scale(0.97);
}

/* ================================
   通路形状ボタン
================================ */

.shape-button {
    min-height: 165px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 7px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        );

    color: #51465c;

    border:
        2px solid #decff5;
}

.shape-button:hover {
    border-color: #c9aeea;
    background: #fffaff;
}

.shape-name {
    font-size: 15px;
    color: #776b80;
}

/* ================================
   図形共通
================================ */

.shape {
    position: relative;

    width: 145px;
    height: 110px;
}

.shape-line {
    position: absolute;

    background: #8e75c4;

    border-radius: 3px;
}

/* ================================
   I字
================================ */

.shape-i .vertical {
    width: 6px;
    height: 92px;

    left: 69px;
    top: 8px;
}

/* ================================
   L字
================================ */

.shape-l .vertical {
    width: 6px;
    height: 82px;

    left: 22px;
    top: 8px;
}

.shape-l .horizontal {
    width: 105px;
    height: 6px;

    left: 22px;
    bottom: 12px;
}

/* ================================
   逆L字
================================ */

.shape-reverse-l .vertical {
    width: 6px;
    height: 82px;

    right: 22px;
    top: 8px;
}

.shape-reverse-l .horizontal {
    width: 108px;
    height: 6px;

    left: 8px;
    bottom: 12px;
}

/* ================================
   逆トの字
================================ */

.shape-reverse-t .vertical {
    width: 6px;
    height: 88px;

    right: 22px;
    top: 8px;
}

.shape-reverse-t .horizontal {
    width: 105px;
    height: 6px;

    left: 8px;
    top: 47px;
}

/* ================================
   横棒
================================ */

.shape-horizontal .horizontal {
    width: 125px;
    height: 6px;

    left: 10px;
    top: 52px;
}

/* ================================
   凸
================================ */

.shape-convex {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-convex svg {
    width: 145px;
    height: 110px;
}

/* ================================
   逆L字＋横棒
================================ */

.shape-complex {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-complex svg {
    width: 145px;
    height: 110px;
}

/* ================================
   1マス部屋
================================ */

.shape-room {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-room .room-box {
    position: absolute;

    width: 30px;
    height: 30px;

    left: 57px;
    top: 38px;

    border:
        5px solid #8e75c4;

    background: #ffffff;
}

/* ================================
   1マス部屋＋十字
================================ */

.shape-room-cross {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-room-cross .cross {
    position: absolute;

    width: 36px;
    height: 36px;

    left: 54px;
    top: 8px;
}

/* 縦 */
.shape-room-cross .cross::before {
    content: "";

    position: absolute;

    width: 6px;
    height: 36px;

    left: 15px;
    top: 0;

    background: #8e75c4;

    border-radius: 3px;
}

/* 横 */
.shape-room-cross .cross::after {
    content: "";

    position: absolute;

    width: 36px;
    height: 6px;

    left: 0;
    top: 15px;

    background: #8e75c4;

    border-radius: 3px;
}

.shape-room-cross .room-box {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 58px;
    top: 50px;

    border:
        5px solid #8e75c4;

    background: white;
}

.shape-room-cross .entrance {
    position: absolute;

    width: 6px;
    height: 20px;

    left: 69px;
    top: 78px;

    background: #8e75c4;

    border-radius: 3px;
}

/* ================================
   1マス部屋＋ホール
================================ */

.shape-room-hall {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-room-hall .hall {
    position: absolute;

    width: 92px;
    height: 62px;

    left: 26px;
    top: 8px;

    border:
        5px solid #8e75c4;

    background: white;

    border-radius: 3px;
}

.shape-room-hall .room-box {
    position: absolute;

    width: 28px;
    height: 28px;

    left: 58px;
    top: 66px;

    border:
        5px solid #8e75c4;

    background: white;
}

.shape-room-hall .entrance {
    position: absolute;

    width: 6px;
    height: 18px;

    left: 69px;
    top: 89px;

    background: #8e75c4;

    border-radius: 3px;
}

/* ================================
   1マス部屋＋十字
   別方向版
================================ */

.shape-room-cross-horizontal {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-room-cross-horizontal svg {
    width: 145px;
    height: 110px;
}

/* ================================
   大部屋
================================ */

.shape-large-room {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-large-room .large-room {
    width: 105px;
    height: 75px;

    border:
        5px solid #8e75c4;

    background: white;

    border-radius: 4px;
}

/* ================================
   逆L＋逆さま逆L
================================ */

.shape-double-reverse {
    display: flex;

    align-items: center;
    justify-content: center;
}

.shape-double-reverse svg {
    width: 145px;
    height: 110px;
}

/* ================================
   結果
================================ */

.result {
    padding: 15px 10px;
}

.result-icon {
    font-size: 46px;
    margin-bottom: 8px;
}

.result-title {
    font-size: 28px;
    color: #c86fa8;
    margin-bottom: 18px;
}

.result-box {
    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );

    border-radius: 22px;

    padding: 23px 18px;

    margin: 18px auto;

    max-width: 580px;
}

.result-location {
    font-size: 21px;

    font-weight: bold;

    color: #765fb0;

    line-height: 1.7;
}

.recommendation {
    margin-top: 16px;

    font-size: 17px;

    font-weight: bold;

    color: #c26d9d;

    line-height: 1.7;
}

.time-warning {
    margin-top: 18px;

    padding: 12px 15px;

    border-radius: 15px;

    background: #fff0f7;

    color: #9b6c87;

    font-size: 15px;

    font-weight: bold;
}

.not-found {
    font-size: 17px;

    line-height: 1.8;

    color: #776b80;
}

.back-button {
    margin-top: 22px;

    background: #ddd5e5;

    color: #655b6b;

    box-shadow: none;

    font-size: 15px;

    padding: 12px 23px;
}

.back-button:hover {
    background: #d2c7dc;
    box-shadow: none;
}

.hidden {
    display: none;
}

/* ================================
   スマホ
================================ */

@media (max-width: 600px) {

    body {
        padding: 18px 10px;
    }

    .container {
        padding:
            27px 13px 32px;

        border-radius: 25px;
    }

    h1 {
        font-size: 29px;
    }

    h2 {
        font-size: 21px;
    }

    .description {
        font-size: 15px;
    }

    .choices {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    button {
        font-size: 17px;
        padding: 17px 10px;
    }

    .shape-button {
        min-height: 155px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- ================================
     入口選択
================================ -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        いくつかの特徴を選択して<br>
        ミューズの位置を特定します。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="choices">

        <button onclick="selectEntrance('center-right-left')">
            中央＋右＋左
        </button>

        <button onclick="selectEntrance('center-right')">
            中央＋右
        </button>

        <button onclick="selectEntrance('center-left')">
            中央＋左
        </button>

        <button onclick="selectEntrance('right-left')">
            右＋左
        </button>

    </div>

</div>


<!-- ================================
     特殊条件
     中央＋左
================================ -->

<div id="special-screen" class="hidden">

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>

    <p class="description">
        「中央＋左」の入口の場合のみ確認します。
    </p>

    <div class="choices">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>

        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 戻る
    </button>

</div>


<!-- ================================
     通路形状選択
================================ -->

<div id="shape-screen" class="hidden">

    <h2 id="shape-question"></h2>

    <div
        id="shape-choices"
        class="choices"
    ></div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- ================================
     結果
================================ -->

<div id="result-screen" class="hidden">

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            ></div>

            <div
                id="result-recommendation"
                class="recommendation"
            ></div>

            <div class="time-warning">
                ⏰ 時間に気を付けてね！
            </div>

        </div>

        <button onclick="goHome()">
            もう一度検索する
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   判定データ
===================================================== */

const patterns = [

    /* ① L＋C＋R
       L → I字
       C → 1マス部屋
       R → L字
    */

    {
        entrance: "center-right-left",

        conditions: {
            left: "i",
            center: "room",
            right: "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から右に進むのがおすすめです！"
    },


    /* ② L＋C＋R */

    {
        entrance: "center-right-left",

        conditions: {
            left: "horizontal",
            center: "room",
            right: "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、やや左に向かうのがおすすめです！"
    },


    /* ③ L＋C＋R */

    {
        entrance: "center-right-left",

        conditions: {
            left: "reverse-l",
            center: "room-cross",
            right: "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右側に向かうのがおすすめです！"
    },


    /* ④ L＋C
       L → すぐ部屋
       C → 1マス部屋＋ホール
    */

    {
        entrance: "center-left",

        conditions: {
            left: "room",
            center: "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "⭐ 左に入ってすぐに部屋があるなら、左側に進むのがおすすめです！"
    },


    /* ⑤ L＋C */

    {
        entrance: "center-left",

        conditions: {
            left: "l",
            center: "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！ 階段のある通路は通り抜けてね。"
    },


    /* ⑥ C＋R */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "double-reverse"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },


    /* ⑦ C＋R */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "large-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！"
    },


    /* ⑧ C＋R */

    {
        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "convex"
        },

        location:
            "中央奥やや右側にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進んで、右を目指すのがおすすめです！"
    },


    /* ⑨ L＋R */

    {
        entrance: "right-left",

        conditions: {
            left: "reverse-t",
            right: "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進み、突き当りで左に進むのがおすすめです！"
    },


    /* ⑩ L＋R */

    {
        entrance: "right-left",

        conditions: {
            left: "reverse-l",
            right: "complex"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側を進むのがおすすめです！"
    }

];


/* =====================================================
   図形名
===================================================== */

const shapeNames = {

    i: "I字",

    l: "L字",

    "reverse-l": "逆L字",

    "reverse-t": "逆トの字",

    horizontal: "横棒",

    t: "トの字",

    room: "1マス部屋",

    "room-cross": "1マス部屋＋十字",

    "room-hall": "1マス部屋＋ホール",

    "room-i": "1マス部屋＋I字",

    convex: "凸",

    complex: "逆L字＋横棒",

    "double-reverse":
        "逆L字＋逆さま逆L字",

    "large-room":
        "大部屋"

};


/* =====================================================
   状態
===================================================== */

let currentEntrance = null;

let answers = {};

let currentDirection = null;


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(entrance) {

    currentEntrance = entrance;

    answers = {};

    hideAllScreens();

    /*
     * 特殊条件は中央＋左
     */

    if (
        entrance === "center-left"
    ) {

        document
            .getElementById("special-screen")
            .classList
            .remove("hidden");

        return;
    }

    showNextShape();
}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(hasRoom) {

    /*
     * 左側に入ってすぐ部屋
     */

    if (hasRoom) {

        showResult(
            "左側にミューズ部屋があります！",
            "⭐ 左に入ってすぐに部屋があるなら、左側から進むのがおすすめです！"
        );

        return;
    }

    answers.special = false;

    showNextShape();
}


/* =====================================================
   入口ごとの確認方向
===================================================== */

function getRequiredDirections() {

    if (
        currentEntrance ===
        "right-left"
    ) {

        return [
            "left",
            "right"
        ];
    }

    if (
        currentEntrance ===
        "center-right"
    ) {

        return [
            "center",
            "right"
        ];
    }

    if (
        currentEntrance ===
        "center-left"
    ) {

        return [
            "center",
            "left"
        ];
    }

    if (
        currentEntrance ===
        "center-right-left"
    ) {

        return [
            "left",
            "center",
            "right"
        ];
    }

    return [];
}


/* =====================================================
   現在の方向に存在する図形だけ取得
===================================================== */

function getAvailableShapes(
    entrance,
    direction
) {

    const availableShapes =
        new Set();

    patterns
        .filter(
            pattern =>
                pattern.entrance === entrance
        )
        .forEach(
            pattern => {

                if (
                    pattern.conditions[direction]
                ) {

                    availableShapes.add(
                        pattern.conditions[direction]
                    );
                }

            }
        );

    return Array.from(
        availableShapes
    );
}


/* =====================================================
   次の質問
===================================================== */

function showNextShape() {

    hideAllScreens();

    const requiredDirections =
        getRequiredDirections();

    const nextDirection =
        requiredDirections.find(
            direction =>
                answers[direction] === undefined
        );

    /*
     * 全部回答済み
     */

    if (!nextDirection) {

        checkResult();

        return;
    }

    currentDirection =
        nextDirection;

    const directionNames = {

        center: "中央",

        right: "右",

        left: "左"

    };

    document
        .getElementById(
            "shape-question"
        )
        .textContent =
        `${directionNames[nextDirection]}の通路はどの形？`;

    const availableShapes =
        getAvailableShapes(
            currentEntrance,
            nextDirection
        );

    const choices =
        document
            .getElementById(
                "shape-choices"
            );

    choices.innerHTML = "";

    availableShapes.forEach(
        shape => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "shape-button";

            button.innerHTML =
                createShapeHTML(shape)
                +
                `
                <span class="shape-name">
                    ${shapeNames[shape]}
                </span>
                `;

            button.onclick =
                function() {

                    answers[currentDirection] =
                        shape;

                    showNextShape();

                };

            choices.appendChild(button);

        }
    );

    if (
        availableShapes.length === 0
    ) {

        choices.innerHTML = `
            <div class="not-found">
                この方向に登録されている
                通路形状がありません。
            </div>
        `;
    }

    document
        .getElementById(
            "shape-screen"
        )
        .classList
        .remove("hidden");
}


/* =====================================================
   図形HTML
===================================================== */

function createShapeHTML(shape) {

    /* I字 */

    if (shape === "i") {

        return `
            <div class="shape shape-i">
                <div class="shape-line vertical"></div>
            </div>
        `;
    }


    /* L字 */

    if (shape === "l") {

        return `
            <div class="shape shape-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆L字 */

    if (shape === "reverse-l") {

        return `
            <div class="shape shape-reverse-l">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 逆ト */

    if (shape === "reverse-t") {

        return `
            <div class="shape shape-reverse-t">
                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* 横棒 */

    if (shape === "horizontal") {

        return `
            <div class="shape shape-horizontal">
                <div class="shape-line horizontal"></div>
            </div>
        `;
    }


    /* トの字 */

    if (shape === "t") {

        return `
            <div class="shape">
                <div
                    class="shape-line"
                    style="
                        width:6px;
                        height:80px;
                        left:69px;
                        top:25px;
                    "
                ></div>

                <div
                    class="shape-line"
                    style="
                        width:105px;
                        height:6px;
                        left:20px;
                        top:25px;
                    "
                ></div>
            </div>
        `;
    }


    /* ================================
       1マス部屋
    ================================= */

    if (shape === "room") {

        return `
            <div class="shape shape-room">
                <div class="room-box"></div>
            </div>
        `;
    }


    /* ================================
       1マス部屋＋十字

       十
       □
       ↑
    ================================= */

    if (shape === "room-cross") {

        return `
            <div class="shape shape-room-cross">

                <div class="cross"></div>

                <div class="room-box"></div>

                <div class="entrance"></div>

            </div>
        `;
    }


    /* ================================
       1マス部屋＋ホール

       大きい四角
          □
          ↑
    ================================= */

    if (shape === "room-hall") {

        return `
            <div class="shape shape-room-hall">

                <div class="hall"></div>

                <div class="room-box"></div>

                <div class="entrance"></div>

            </div>
        `;
    }


    /* ================================
       1マス＋I字
    ================================= */

    if (shape === "room-i") {

        return `
            <div class="shape">

                <div
                    class="shape-line"
                    style="
                        width:6px;
                        height:35px;
                        left:69px;
                        top:5px;
                    "
                ></div>

                <div
                    style="
                        position:absolute;
                        width:28px;
                        height:28px;
                        left:58px;
                        top:38px;
                        border:5px solid #8e75c4;
                        background:white;
                    "
                ></div>

                <div
                    class="shape-line"
                    style="
                        width:6px;
                        height:35px;
                        left:69px;
                        top:66px;
                    "
                ></div>

            </div>
        `;
    }


    /* 凸 */

    if (shape === "convex") {

        return `
            <div class="shape shape-convex">

                <svg
                    viewBox="0 0 145 110"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            8,88
                            8,52
                            50,52
                            50,20
                            95,20
                            95,52
                            137,52
                            137,88
                            8,88
                        "

                        fill="none"

                        stroke="#8e75c4"

                        stroke-width="6"

                        stroke-linejoin="round"

                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* 逆L＋横棒 */

    if (shape === "complex") {

        return `
            <div class="shape shape-complex">

                <svg
                    viewBox="0 0 145 110"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            8,88
                            66,88
                            66,25
                            137,25
                        "

                        fill="none"

                        stroke="#8e75c4"

                        stroke-width="6"

                        stroke-linejoin="round"

                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }


    /* 大部屋 */

    if (shape === "large-room") {

        return `
            <div class="shape shape-large-room">
                <div class="large-room"></div>
            </div>
        `;
    }


    /* 逆L＋逆さま逆L */

    if (shape === "double-reverse") {

        return `
            <div class="shape shape-double-reverse">

                <svg
                    viewBox="0 0 145 110"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline
                        points="
                            8,82
                            45,82
                            45,35
                            75,35
                            75,75
                            137,75
                        "

                        fill="none"

                        stroke="#8e75c4"

                        stroke-width="6"

                        stroke-linejoin="round"

                        stroke-linecap="round"
                    />

                </svg>

            </div>
        `;
    }

    return "";
}


/* =====================================================
   判定
===================================================== */

function checkResult() {

    const possiblePatterns =
        patterns.filter(
            pattern =>
                pattern.entrance ===
                currentEntrance
        );

    const matchedPattern =
        possiblePatterns.find(
            pattern => {

                return Object.keys(
                    pattern.conditions
                ).every(
                    direction => {

                        return (
                            answers[direction]
                            ===
                            pattern.conditions[direction]
                        );

                    }
                );

            }
        );

    if (matchedPattern) {

        showResult(
            matchedPattern.location,
            matchedPattern.recommendation
        );

        return;
    }

    hideAllScreens();

    document
        .getElementById(
            "result-location"
        )
        .innerHTML = `
            <div class="not-found">

                ごめんなさい。<br><br>

                この通路の組み合わせは、
                現在登録されていません。<br><br>

                新しいマップが分かったら、
                判定データに追加できます！

            </div>
        `;

    document
        .getElementById(
            "result-recommendation"
        )
        .textContent = "";

    document
        .getElementById(
            "result-screen"
        )
        .classList
        .remove("hidden");
}


/* =====================================================
   結果表示
===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();

    document
        .getElementById(
            "result-location"
        )
        .textContent =
        location;

    document
        .getElementById(
            "result-recommendation"
        )
        .textContent =
        recommendation;

    document
        .getElementById(
            "result-screen"
        )
        .classList
        .remove("hidden");
}


/* =====================================================
   全画面を隠す
===================================================== */

function hideAllScreens() {

    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "special-screen"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "shape-screen"
        )
        .classList
        .add("hidden");

    document
        .getElementById(
            "result-screen"
        )
        .classList
        .add("hidden");
}


/* =====================================================
   最初に戻る
===================================================== */

function goHome() {

    currentEntrance = null;

    answers = {};

    currentDirection = null;

    hideAllScreens();

    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .remove("hidden");
}

</script>
