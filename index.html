<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 16px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f1edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    text-align: center;
    color: #51465c;
}


/* ================================
   メインカード
================================ */

.container {
    max-width: 760px;
    margin: 0 auto;

    background:
        rgba(255, 255, 255, 0.95);

    border-radius: 30px;

    padding:
        35px 22px 45px;

    box-shadow:
        0 8px 25px
        rgba(120, 90, 140, 0.15);
}


/* ================================
   タイトル
================================ */

h1 {
    font-size: 38px;

    color: #c86fa8;

    margin:
        0 0 12px;

    letter-spacing: 2px;
}


.description {
    font-size: 18px;

    color: #776b80;

    line-height: 1.8;

    margin:
        0 0 35px;
}


h2 {
    font-size: 25px;

    color: #8d76c7;

    margin:
        0 0 22px;

    line-height: 1.5;
}


/* ================================
   通常ボタン
================================ */

.choices {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 16px;

    max-width: 620px;

    margin: 0 auto;
}


button {
    padding:
        19px 14px;

    border:
        none;

    border-radius:
        20px;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    color:
        white;

    font-size:
        19px;

    font-weight:
        bold;

    cursor:
        pointer;

    box-shadow:
        0 5px 12px
        rgba(150, 110, 170, 0.2);

    transition:
        0.2s;
}


button:hover {
    transform:
        translateY(-3px);

    box-shadow:
        0 8px 16px
        rgba(150, 110, 170, 0.3);
}


button:active {
    transform:
        scale(0.97);
}


/* ================================
   YES / NO
================================ */

.yes {
    background:
        linear-gradient(
            135deg,
            #f5a5c9,
            #e68eb9
        );
}


.no {
    background:
        linear-gradient(
            135deg,
            #aeb5ec,
            #8f91d8
        );
}


.yes-no {
    max-width:
        500px;
}


/* ================================
   組み合わせカード
================================ */

.pattern-choices {
    display:
        grid;

    grid-template-columns:
        1fr;

    gap:
        14px;

    max-width:
        650px;

    margin:
        0 auto;
}


.pattern-card {
    width:
        100%;

    min-height:
        155px;

    padding:
        14px 16px;

    border:
        2px solid #eadcf7;

    border-radius:
        22px;

    background:
        linear-gradient(
            135deg,
            #fffafd,
            #f8f4ff
        );

    color:
        #51465c;

    box-shadow:
        0 4px 12px
        rgba(150, 110, 170, 0.12);

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    gap:
        9px;
}


.pattern-card:hover {
    border-color:
        #d6bce9;

    background:
        linear-gradient(
            135deg,
            #fff7fc,
            #f6f0ff
        );
}


.pattern-number {
    font-size:
        16px;

    font-weight:
        bold;

    color:
        #b06fa8;
}


/* ================================
   ★ 通路の配置

   実際のマップと同じように

   左   中央   右

   の順番で表示する
================================ */

.pattern-pair {
    display:
        flex;

    justify-content:
        center;

    align-items:
        flex-start;

    gap:
        22px;

    flex-wrap:
        nowrap;
}


.pattern-side {
    min-width:
        110px;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    gap:
        4px;
}


.pattern-label {
    font-size:
        13px;

    color:
        #9a8ba4;

    font-weight:
        bold;
}


.pattern-name {
    font-size:
        13px;

    color:
        #75677f;

    font-weight:
        bold;
}


.pattern-result {
    font-size:
        14px;

    color:
        #9a6ba7;

    font-weight:
        bold;
}


/* ================================
   図形
================================ */

.shape {
    position:
        relative;

    width:
        90px;

    height:
        65px;

    flex:
        0 0 90px;
}


.shape-line {
    position:
        absolute;

    background:
        linear-gradient(
            180deg,
            #e58fbd,
            #9b86d8
        );

    border-radius:
        5px;

    box-shadow:
        0 1px 3px
        rgba(160, 100, 170, 0.18);
}


/* ================================
   I字
================================ */

.shape-i .vertical {
    width:
        5px;

    height:
        58px;

    left:
        43px;

    top:
        3px;
}


/* ================================
   L字

   └
================================ */

.shape-l .vertical {
    width:
        5px;

    height:
        53px;

    left:
        13px;

    top:
        3px;
}


.shape-l .horizontal {
    width:
        68px;

    height:
        5px;

    left:
        13px;

    bottom:
        6px;
}


/* ================================
   逆L字

       │
       │
   ────┘
================================ */

.shape-reverse-l .vertical {
    width:
        5px;

    height:
        53px;

    right:
        13px;

    top:
        3px;
}


.shape-reverse-l .horizontal {
    width:
        70px;

    height:
        5px;

    left:
        7px;

    bottom:
        6px;
}


/* ================================
   逆トの字

   ─────┐
        │
        │
================================ */

.shape-reverse-t .vertical {
    width:
        5px;

    height:
        56px;

    right:
        13px;

    top:
        3px;
}


.shape-reverse-t .horizontal {
    width:
        68px;

    height:
        5px;

    left:
        7px;

    top:
        28px;
}


/* ================================
   SVG
================================ */

.shape svg {
    width:
        90px;

    height:
        65px;

    display:
        block;
}


/* ================================
   戻るボタン
================================ */

.back-button {
    margin-top:
        24px;

    background:
        #ddd5e5;

    color:
        #655b6b;

    box-shadow:
        none;

    font-size:
        16px;

    padding:
        12px 24px;
}


.back-button:hover {
    background:
        #d2c7dc;

    box-shadow:
        none;
}


/* ================================
   結果
================================ */

.result {
    padding:
        20px 10px;
}


.result-icon {
    font-size:
        48px;

    margin-bottom:
        8px;
}


.result-title {
    font-size:
        29px;

    color:
        #c86fa8;

    margin-bottom:
        18px;
}


.result-box {
    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );

    border-radius:
        22px;

    padding:
        24px 18px;

    margin:
        18px auto;

    max-width:
        560px;
}


.result-location {
    font-size:
        23px;

    font-weight:
        bold;

    color:
        #765fb0;

    line-height:
        1.7;
}


.recommendation {
    margin-top:
        16px;

    font-size:
        18px;

    font-weight:
        bold;

    color:
        #c26d9d;
}


.not-found {
    font-size:
        17px;

    line-height:
        1.8;

    color:
        #776b80;

    padding:
        15px;
}


.hidden {
    display:
        none;
}


/* ================================
   スマホ
================================ */

@media (max-width: 600px) {

    body {
        padding:
            18px 10px;
    }


    .container {
        padding:
            28px 13px 35px;

        border-radius:
            25px;
    }


    h1 {
        font-size:
            30px;
    }


    h2 {
        font-size:
            21px;
    }


    .description {
        font-size:
            16px;
    }


    .choices {
        grid-template-columns:
            1fr;

        gap:
            12px;
    }


    button {
        font-size:
            18px;

        padding:
            17px 10px;
    }


    .pattern-card {
        min-height:
            145px;

        padding:
            12px 8px;
    }


    .pattern-pair {
        gap:
            8px;
    }


    .pattern-side {
        min-width:
            88px;
    }


    .shape {
        width:
            78px;

        height:
            57px;

        flex-basis:
            78px;
    }


    .shape svg {
        width:
            78px;

        height:
            57px;
    }


    .shape-i .vertical {
        height:
            50px;

        left:
            37px;
    }


    .shape-l .vertical,
    .shape-reverse-l .vertical {
        height:
            45px;
    }


    .shape-l .horizontal,
    .shape-reverse-l .horizontal {
        width:
            60px;
    }


    .shape-reverse-t .vertical {
        height:
            48px;
    }


    .shape-reverse-t .horizontal {
        width:
            58px;

        top:
            25px;
    }


    .result-location {
        font-size:
            21px;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- ================================
     入口選択
================================ -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>


    <p class="description">
        いくつかの特徴を選択して<br>
        ミューズの位置を特定します。
    </p>


    <h2>
        ① 入口の形を選択してください
    </h2>


    <div class="choices">

        <button
            onclick="selectEntrance('center-right-left')"
        >
            中央＋右＋左
        </button>


        <button
            onclick="selectEntrance('center-right')"
        >
            中央＋右
        </button>


        <button
            onclick="selectEntrance('center-left')"
        >
            中央＋左
        </button>


        <button
            onclick="selectEntrance('right-left')"
        >
            右＋左
        </button>

    </div>

</div>


<!-- ================================
     特殊条件
     
     ★ 中央＋左の場合のみ
================================ -->

<div
    id="special-screen"
    class="hidden"
>

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>


    <p class="description">
        「中央＋左」の入口の場合のみ確認します。
    </p>


    <div class="choices yes-no">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>


        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>


    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 戻る
    </button>

</div>


<!-- ================================
     組み合わせ選択
================================ -->

<div
    id="pattern-screen"
    class="hidden"
>

    <h2>
        ② 当てはまる通路の<br>
        組み合わせを選択してください
    </h2>


    <p class="description">
        実際のマップと見比べて、<br>
        一致するものをひとつ選んでください。
    </p>


    <div
        id="pattern-choices"
        class="pattern-choices"
    >
    </div>


    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- ================================
     結果
================================ -->

<div
    id="result-screen"
    class="hidden"
>

    <div class="result">

        <div class="result-icon">
            🎯
        </div>


        <div class="result-title">
            ミューズ部屋を発見！
        </div>


        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            >
            </div>


            <div
                id="result-recommendation"
                class="recommendation"
            >
            </div>

        </div>


        <button
            onclick="goHome()"
        >
            もう一度検索する
        </button>

    </div>

</div>


</div>


<script>


/* =====================================================
   ★★★★★ 判定データ ★★★★★

   新しいマップを追加するときは、
   この配列にデータを追加するだけ。

   entrance:
   入口の形

   conditions:
   その入口から見た各通路の形

   location:
   ミューズの位置

   recommendation:
   おすすめの進行方向

===================================================== */


const patterns = [

    /* ==============================================
       ① 右＋左

       左 → 逆トの字
       右 → 逆L字

       ミューズ → 右側
       おすすめ → 右
    ============================================== */

    {
        entrance:
            "right-left",

        conditions: {

            left:
                "reverse-t",

            right:
                "reverse-l"

        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "⭐ 右側から進むのがおすすめです！"
    },


    /* ==============================================
       ② 中央＋右

       中央 → I字
       右 → 凸

       ミューズ → 中央寄りの右奥
       おすすめ → 右
    ============================================== */

    {
        entrance:
            "center-right",

        conditions: {

            center:
                "i",

            right:
                "convex"

        },

        location:
            "中央寄りの右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 右側から進むのがおすすめです！"
    },


    /* ==============================================
       ③ 中央＋左

       中央 → I字
       左 → L字

       ミューズ → 中央奥
       おすすめ → 中央
    ============================================== */

    {
        entrance:
            "center-left",

        conditions: {

            center:
                "i",

            left:
                "l"

        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "⭐ 中央から進むのがおすすめです！"
    },


    /* ==============================================
       ④ 中央＋右＋左

       中央 → I字
       右 → 逆L字＋横棒
       左 → 逆L字

       ミューズ → 右奥
       おすすめ → 右
    ============================================== */

    {
        entrance:
            "center-right-left",

        conditions: {

            center:
                "i",

            right:
                "complex",

            left:
                "reverse-l"

        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "⭐ 右側から進むのがおすすめです！"
    }

];


/* =====================================================
   図形の名前
===================================================== */

const shapeNames = {

    i:
        "I字",

    l:
        "L字",

    "reverse-l":
        "逆L字",

    "reverse-t":
        "逆トの字",

    convex:
        "凸",

    complex:
        "逆L字＋横棒"

};


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(
    entrance
) {

    hideAllScreens();


    /*
     * ★ 中央＋左の場合のみ
     * 「左側にすぐ部屋がある？」
     * を確認する
     */

    if (
        entrance ===
        "center-left"
    ) {

        document
            .getElementById(
                "special-screen"
            )
            .classList
            .remove("hidden");

        return;
    }


    /*
     * その他の入口は
     * 直接組み合わせ一覧へ
     */

    currentEntrance =
        entrance;

    showPatternChoices();

}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(
    hasRoom
) {

    /*
     * 左側に入ってすぐ
     * 部屋があった場合
     */

    if (
        hasRoom
    ) {

        showResult(

            "左側にミューズ部屋があります！",

            "⭐ 左側から進むのがおすすめです！"

        );

        return;
    }


    /*
     * 部屋がなかった場合は
     * 通常の組み合わせ判定へ
     */

    currentEntrance =
        "center-left";

    showPatternChoices();

}


/* =====================================================
   組み合わせ一覧を表示
===================================================== */

function showPatternChoices() {

    hideAllScreens();


    const choices =
        document.getElementById(
            "pattern-choices"
        );


    choices.innerHTML =
        "";


    const availablePatterns =

        patterns.filter(

            pattern =>

                pattern.entrance ===
                currentEntrance

        );


    /*
     * 登録されていない入口
     */

    if (
        availablePatterns.length ===
        0
    ) {

        choices.innerHTML = `

            <div
                class="not-found"
            >

                この入口に登録されている<br>
                マップがありません。

            </div>

        `;

        document
            .getElementById(
                "pattern-screen"
            )
            .classList
            .remove("hidden");

        return;
    }


    /*
     * 登録されているパターンを
     * 一括表示
     */

    availablePatterns.forEach(

        (
            pattern,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "pattern-card";


            let pairHTML =
                "";


            /*
             * ★重要
             *
             * 実際の位置関係と同じように
             *
             * 左 → 中央 → 右
             *
             * の順番で表示する。
             */

            [
                "left",
                "center",
                "right"

            ].forEach(

                direction => {

                    /*
                     * その方向が
                     * 存在しなければ表示しない
                     */

                    if (
                        !pattern.conditions[
                            direction
                        ]
                    ) {

                        return;
                    }


                    const shape =
                        pattern.conditions[
                            direction
                        ];


                    pairHTML += `

                        <div
                            class="pattern-side"
                        >

                            <span
                                class="pattern-label"
                            >
                                ${
                                    directionNames(
                                        direction
                                    )
                                }
                            </span>


                            ${
                                createShapeHTML(
                                    shape
                                )
                            }


                            <span
                                class="pattern-name"
                            >
                                ${
                                    shapeNames[
                                        shape
                                    ]
                                }
                            </span>

                        </div>

                    `;

                }

            );


            button.innerHTML = `

                <span
                    class="pattern-number"
                >
                    パターン ${index + 1}
                </span>


                <div
                    class="pattern-pair"
                >

                    ${pairHTML}

                </div>


                <span
                    class="pattern-result"
                >
                    この組み合わせを選択
                </span>

            `;


            button.onclick =

                function() {

                    showResult(

                        pattern.location,

                        pattern.recommendation

                    );

                };


            choices.appendChild(
                button
            );

        }

    );


    document
        .getElementById(
            "pattern-screen"
        )
        .classList
        .remove("hidden");

}


/* =====================================================
   方向名
===================================================== */

function directionNames(
    direction
) {

    const names = {

        center:
            "中央",

        right:
            "右",

        left:
            "左"

    };


    return names[
        direction
    ];

}


/* =====================================================
   図形作成
===================================================== */

function createShapeHTML(
    shape
) {


    /* ================================
       I字
    ================================= */

    if (
        shape ===
        "i"
    ) {

        return `

            <div
                class="shape shape-i"
            >

                <div
                    class="shape-line vertical"
                >
                </div>

            </div>

        `;

    }


    /* ================================
       L字
    ================================= */

    if (
        shape ===
        "l"
    ) {

        return `

            <div
                class="shape shape-l"
            >

                <div
                    class="shape-line vertical"
                >
                </div>


                <div
                    class="shape-line horizontal"
                >
                </div>

            </div>

        `;

    }


    /* ================================
       逆L字
    ================================= */

    if (
        shape ===
        "reverse-l"
    ) {

        return `

            <div
                class="shape shape-reverse-l"
            >

                <div
                    class="shape-line vertical"
                >
                </div>


                <div
                    class="shape-line horizontal"
                >
                </div>

            </div>

        `;

    }


    /* ================================
       逆トの字
    ================================= */

    if (
        shape ===
        "reverse-t"
    ) {

        return `

            <div
                class="shape shape-reverse-t"
            >

                <div
                    class="shape-line vertical"
                >
                </div>


                <div
                    class="shape-line horizontal"
                >
                </div>

            </div>

        `;

    }


    /* ================================
       凸
    ================================= */

    if (
        shape ===
        "convex"
    ) {

        return `

            <div
                class="shape"
            >

                <svg
                    viewBox="0 0 180 135"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline

                        points="
                            10,110
                            10,60
                            70,60
                            75,25
                            120,25
                            120,60
                            160,60
                            160,110
                            10,110
                        "

                        fill="none"

                        stroke="#b98ad2"

                        stroke-width="7"

                        stroke-linejoin="round"

                        stroke-linecap="round"

                    />

                </svg>

            </div>

        `;

    }


    /* ================================
       逆L字＋横棒
    ================================= */

    if (
        shape ===
        "complex"
    ) {

        return `

            <div
                class="shape"
            >

                <svg
                    viewBox="0 0 180 135"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <polyline

                        points="
                            8,105
                            82,105
                            78,25
                            165,25
                        "

                        fill="none"

                        stroke="#b98ad2"

                        stroke-width="7"

                        stroke-linejoin="round"

                        stroke-linecap="round"

                    />

                </svg>

            </div>

        `;

    }


    return "";

}


/* =====================================================
   結果表示
===================================================== */

function showResult(

    location,

    recommendation

) {

    hideAllScreens();


    document
        .getElementById(
            "result-location"
        )
        .textContent =
            location;


    document
        .getElementById(
            "result-recommendation"
        )
        .textContent =
            recommendation;


    document
        .getElementById(
            "result-screen"
        )
        .classList
        .remove("hidden");

}


/* =====================================================
   全画面を隠す
===================================================== */

function hideAllScreens() {

    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "special-screen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "pattern-screen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "result-screen"
        )
        .classList
        .add("hidden");

}


/* =====================================================
   最初に戻る
===================================================== */

function goHome() {

    currentEntrance =
        null;


    hideAllScreens();


    document
        .getElementById(
            "entrance-screen"
        )
        .classList
        .remove("hidden");

}
