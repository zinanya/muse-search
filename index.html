<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>手記の加筆 ミューズ検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #f2edff,
            #e9f8ff
        );

    font-family:
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    color: #51465c;
    text-align: center;
}

.container {
    max-width: 820px;
    margin: 0 auto;

    background: rgba(255,255,255,0.95);

    border-radius: 30px;

    padding: 30px 20px 40px;

    box-shadow:
        0 8px 25px rgba(120,90,140,0.15);
}

h1 {
    margin: 0 0 10px;

    font-size: 36px;

    color: #c86fa8;

    letter-spacing: 2px;
}

.description {
    margin: 0 0 30px;

    font-size: 17px;

    color: #776b80;

    line-height: 1.8;
}

h2 {
    margin: 0 0 22px;

    font-size: 24px;

    color: #8d76c7;

    line-height: 1.5;
}

button {
    border: none;
    border-radius: 18px;

    padding: 18px 15px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #f7a9cf,
            #bda9f3
        );

    box-shadow:
        0 5px 12px rgba(150,110,170,0.18);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 16px rgba(150,110,170,0.25);
}

button:active {
    transform: scale(0.97);
}

.choices {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

    max-width: 620px;

    margin: 0 auto;
}

/* ================================
   パターンカード
================================ */

.pattern-list {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 16px;

    max-width: 760px;

    margin: 0 auto;
}

.pattern-card {
    padding: 15px;

    border-radius: 20px;

    border: 2px solid #e5d8f4;

    background:
        linear-gradient(
            135deg,
            #fffafd,
            #f8f4ff
        );

    cursor: pointer;

    transition: 0.2s;
}

.pattern-card:hover {
    transform: translateY(-3px);

    border-color: #cdaee9;

    box-shadow:
        0 7px 18px rgba(150,110,170,0.16);
}

.pattern-number {
    font-size: 16px;

    font-weight: bold;

    color: #c26d9d;

    margin-bottom: 10px;
}

.pattern-paths {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 6px;

    align-items: center;
}

.path-column {
    min-width: 0;
}

.path-label {
    font-size: 13px;

    font-weight: bold;

    color: #8d76c7;

    margin-bottom: 3px;
}

.path-name {
    font-size: 11px;

    color: #776b80;

    line-height: 1.3;
}

.pattern-result {
    margin-top: 12px;

    padding-top: 10px;

    border-top:
        1px solid #eadff4;

    font-size: 14px;

    font-weight: bold;

    color: #765fb0;

    line-height: 1.5;
}

/* ================================
   図形
================================ */

.shape {
    width: 75px;
    height: 55px;

    margin: 0 auto 3px;

    position: relative;
}

.shape-line {
    position: absolute;

    background: #8f76b5;

    border-radius: 3px;
}

/* I字 */

.shape-i .vertical {
    width: 5px;
    height: 45px;

    left: 35px;
    top: 5px;
}

/* L字 */

.shape-l .vertical {
    width: 5px;
    height: 40px;

    left: 12px;
    top: 5px;
}

.shape-l .horizontal {
    height: 5px;
    width: 55px;

    left: 12px;
    bottom: 5px;
}

/* 逆L字 */

.shape-reverse-l .vertical {
    width: 5px;
    height: 40px;

    right: 12px;
    top: 5px;
}

.shape-reverse-l .horizontal {
    height: 5px;
    width: 55px;

    left: 8px;
    bottom: 5px;
}

/* 逆ト */

.shape-reverse-t .vertical {
    width: 5px;
    height: 42px;

    right: 10px;
    top: 5px;
}

.shape-reverse-t .horizontal {
    height: 5px;
    width: 58px;

    left: 7px;
    top: 26px;
}

/* ト */

.shape-t .vertical {
    width: 5px;
    height: 40px;

    left: 35px;
    top: 10px;
}

.shape-t .horizontal {
    height: 5px;
    width: 60px;

    left: 7px;
    top: 10px;
}

/* 横棒 */

.shape-horizontal .horizontal {
    height: 5px;
    width: 65px;

    left: 5px;
    top: 26px;
}

/* 凸 */

.shape-convex svg,
.shape-complex svg,
.shape-y svg,
.shape-cross svg,
.shape-hall svg,
.shape-room svg,
.shape-room-cross svg {
    width: 75px;
    height: 55px;
}

/* ================================
   YES / NO
================================ */

.yes-no {
    max-width: 500px;
}

.yes {
    background:
        linear-gradient(
            135deg,
            #f5a5c9,
            #e68eb9
        );
}

.no {
    background:
        linear-gradient(
            135deg,
            #aeb5ec,
            #8f91d8
        );
}

/* ================================
   戻る
================================ */

.back-button {
    margin-top: 22px;

    padding: 12px 24px;

    font-size: 15px;

    background: #ddd5e5;

    color: #655b6b;

    box-shadow: none;
}

.back-button:hover {
    background: #d2c7dc;

    box-shadow: none;
}

/* ================================
   結果
================================ */

.result {
    padding: 15px 5px;
}

.result-icon {
    font-size: 46px;

    margin-bottom: 5px;
}

.result-title {
    font-size: 28px;

    font-weight: bold;

    color: #c86fa8;

    margin-bottom: 18px;
}

.result-box {
    max-width: 600px;

    margin: 0 auto;

    padding: 23px 18px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #fff5fb,
            #f5f1ff
        );
}

.result-location {
    font-size: 22px;

    font-weight: bold;

    color: #765fb0;

    line-height: 1.7;
}

.recommendation {
    margin-top: 15px;

    font-size: 18px;

    font-weight: bold;

    color: #c26d9d;

    line-height: 1.6;
}

.time-warning {
    margin-top: 15px;

    padding: 12px;

    border-radius: 14px;

    background: #fff4f8;

    color: #9b687f;

    font-size: 15px;

    font-weight: bold;
}

.not-found {
    font-size: 17px;

    line-height: 1.8;

    color: #776b80;
}

.hidden {
    display: none;
}

/* ================================
   スマホ
================================ */

@media (max-width: 650px) {

    body {
        padding: 15px 10px;
    }

    .container {
        padding: 25px 12px 32px;

        border-radius: 24px;
    }

    h1 {
        font-size: 29px;
    }

    h2 {
        font-size: 21px;
    }

    .description {
        font-size: 15px;
    }

    .choices {
        grid-template-columns: 1fr;
    }

    .pattern-list {
        grid-template-columns: 1fr;
    }

    .pattern-card {
        padding: 14px 8px;
    }

    .pattern-paths {
        gap: 2px;
    }

    .shape {
        transform: scale(0.9);
    }

    .path-name {
        font-size: 10px;
    }

    .result-location {
        font-size: 20px;
    }

    .recommendation {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- ================================
     ホーム
================================ -->

<div id="entrance-screen">

    <h1>
        手記の加筆<br>
        ミューズ検索
    </h1>

    <p class="description">
        入口の形を選択して、<br>
        ミューズの位置を特定します。
    </p>

    <h2>
        ① 入口の形を選択してください
    </h2>

    <div class="choices">

        <button onclick="selectEntrance('left-center-right')">
            左＋中央＋右
        </button>

        <button onclick="selectEntrance('left-center')">
            左＋中央
        </button>

        <button onclick="selectEntrance('center-right')">
            中央＋右
        </button>

        <button onclick="selectEntrance('left-right')">
            左＋右
        </button>

    </div>

</div>


<!-- ================================
     特殊条件
================================ -->

<div id="special-screen" class="hidden">

    <h2>
        左側に入ってすぐ、<br>
        部屋がありますか？
    </h2>

    <p class="description">
        「左＋中央」の入口の場合のみ確認します。
    </p>

    <div class="choices yes-no">

        <button
            class="yes"
            onclick="specialAnswer(true)"
        >
            はい
        </button>

        <button
            class="no"
            onclick="specialAnswer(false)"
        >
            いいえ
        </button>

    </div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- ================================
     パターン選択
================================ -->

<div id="pattern-screen" class="hidden">

    <h2 id="pattern-question"></h2>

    <p class="description">
        実際の通路に近いものを選択してください。
    </p>

    <div
        id="pattern-list"
        class="pattern-list"
    ></div>

    <button
        class="back-button"
        onclick="goHome()"
    >
        ← 最初に戻る
    </button>

</div>


<!-- ================================
     結果
================================ -->

<div id="result-screen" class="hidden">

    <div class="result">

        <div class="result-icon">
            🎯
        </div>

        <div class="result-title">
            ミューズ部屋を発見！
        </div>

        <div class="result-box">

            <div
                id="result-location"
                class="result-location"
            ></div>

            <div
                id="result-recommendation"
                class="recommendation"
            ></div>

            <div class="time-warning">
                ⚠️ 時間に気を付けてね！
            </div>

        </div>

        <button
            onclick="goHome()"
            style="margin-top:20px;"
        >
            もう一度検索する
        </button>

    </div>

</div>

</div>


<script>

/* =====================================================
   ★★★★★ 判定データ ★★★★★

   新しいマップを追加するときは、
   基本的にここへ1つ追加するだけ！

   ===================================================== */

const patterns = [

    /* ① */

    {
        id: 1,

        entrance: "left-center-right",

        conditions: {
            left: "i",
            center: "room",
            right: "l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 中央から右に進むのがおすすめです！"
    },


    /* ② */

    {
        id: 2,

        entrance: "left-center-right",

        conditions: {
            left: "horizontal",
            center: "room",
            right: "t"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、やや左に向かうのがおすすめです！"
    },


    /* ③ */

    {
        id: 3,

        entrance: "left-center-right",

        conditions: {
            left: "reverse-l",
            center: "room-cross",
            right: "l"
        },

        location:
            "右奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、右側に向かうのがおすすめです！"
    },


    /* ④ */

    {
        id: 4,

        entrance: "left-center",

        conditions: {
            left: "room",
            center: "room-hall"
        },

        location:
            "左側にミューズ部屋があります！",

        recommendation:
            "☆ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
    },


    /* ⑤ */

    {
        id: 5,

        entrance: "left-center",

        conditions: {
            left: "l",
            center: "room-i"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進むのがおすすめです。階段のある通路は通り抜けてね！"
    },


    /* ⑥ */

    {
        id: 6,

        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "y-complex"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、Y字路を左に曲がるのがおすすめです！"
    },


    /* ⑦ */

    {
        id: 7,

        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "big-room"
        },

        location:
            "中央奥にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進むのがおすすめです！"
    },


    /* ⑧ */

    {
        id: 8,

        entrance: "center-right",

        conditions: {
            center: "room-cross",
            right: "convex"
        },

        location:
            "中央奥やや右側にミューズ部屋があります！",

        recommendation:
            "☆ 中央から進んで、右を目指すのがおすすめです！"
    },


    /* ⑨ */

    {
        id: 9,

        entrance: "left-right",

        conditions: {
            left: "reverse-t",
            right: "reverse-l"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 右側を進み、突き当りで左に進むのがおすすめです！"
    },


    /* ⑩ */

    {
        id: 10,

        entrance: "left-right",

        conditions: {
            left: "reverse-l",
            right: "complex"
        },

        location:
            "右側にミューズ部屋があります！",

        recommendation:
            "☆ 右側を進むのがおすすめです！"
    }

];


/* =====================================================
   図形名
===================================================== */

const shapeNames = {

    i:
        "Iの字",

    l:
        "Lの字",

    "reverse-l":
        "逆Lの字",

    "reverse-t":
        "逆トの字",

    t:
        "トの字",

    horizontal:
        "横棒",

    room:
        "1マス部屋",

    "room-cross":
        "1マス部屋＋十字",

    "room-i":
        "1マス＋I字",

    "room-hall":
        "1マス部屋＋ホール",

    convex:
        "凸の字",

    "y-complex":
        "上下に分岐する複合形",

    "big-room":
        "大部屋",

    complex:
        "逆L字＋横棒"
};


/* =====================================================
   入口名
===================================================== */

const entranceNames = {

    "left-center-right":
        "左＋中央＋右",

    "left-center":
        "左＋中央",

    "center-right":
        "中央＋右",

    "left-right":
        "左＋右"
};


/* =====================================================
   状態
===================================================== */

let currentEntrance = null;


/* =====================================================
   入口選択
===================================================== */

function selectEntrance(entrance) {

    currentEntrance = entrance;

    hideAllScreens();


    /*
     * 特殊条件は
     * 「左＋中央」の④のみ
     */

    if (entrance === "left-center") {

        document
            .getElementById("special-screen")
            .classList
            .remove("hidden");

        return;
    }


    showPatterns();

}


/* =====================================================
   特殊条件
===================================================== */

function specialAnswer(hasRoom) {

    /*
     * 左に入ってすぐ部屋
     */

    if (hasRoom) {

        showResult(
            "左側にミューズ部屋があります！",
            "☆ 左に入ってすぐに部屋があるなら、確定で左側にミューズがあります！"
        );

        return;
    }


    /*
     * ない場合は
     * ④以外の「左＋中央」を表示
     */

    showPatterns(5);
}


/* =====================================================
   パターン表示
===================================================== */

function showPatterns(excludeId = null) {

    hideAllScreens();


    const availablePatterns =
        patterns.filter(pattern => {

            return (
                pattern.entrance === currentEntrance &&
                pattern.id !== excludeId
            );

        });


    document
        .getElementById("pattern-question")
        .textContent =
            `${entranceNames[currentEntrance]} の通路を選択してください`;


    const list =
        document.getElementById("pattern-list");


    list.innerHTML = "";


    availablePatterns.forEach(pattern => {

        const card =
            document.createElement("div");


        card.className =
            "pattern-card";


        card.onclick =
            function() {

                showResult(
                    pattern.location,
                    pattern.recommendation
                );

            };


        card.innerHTML =
            createPatternHTML(pattern);


        list.appendChild(card);

    });


    document
        .getElementById("pattern-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   パターンカード生成
===================================================== */

function createPatternHTML(pattern) {

    const c =
        pattern.conditions;


    let html = `

        <div class="pattern-number">
            パターン ${pattern.id}
        </div>

        <div class="pattern-paths">
    `;


    /*
     * 左
     */

    if (c.left) {

        html += `

            <div class="path-column">

                <div class="path-label">
                    左
                </div>

                ${createShapeHTML(c.left)}

                <div class="path-name">
                    ${shapeNames[c.left]}
                </div>

            </div>
        `;
    }


    /*
     * 中央
     */

    if (c.center) {

        html += `

            <div class="path-column">

                <div class="path-label">
                    中央
                </div>

                ${createShapeHTML(c.center)}

                <div class="path-name">
                    ${shapeNames[c.center]}
                </div>

            </div>
        `;
    }


    /*
     * 右
     */

    if (c.right) {

        html += `

            <div class="path-column">

                <div class="path-label">
                    右
                </div>

                ${createShapeHTML(c.right)}

                <div class="path-name">
                    ${shapeNames[c.right]}
                </div>

            </div>
        `;
    }


    html += `

        </div>

        <div class="pattern-result">
            ${pattern.location}
        </div>
    `;


    return html;
}


/* =====================================================
   図形HTML
===================================================== */

function createShapeHTML(shape) {


    /* I */

    if (shape === "i") {

        return `

            <div class="shape shape-i">

                <div class="shape-line vertical"></div>

            </div>

        `;
    }


    /* L */

    if (shape === "l") {

        return `

            <div class="shape shape-l">

                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>

            </div>

        `;
    }


    /* 逆L */

    if (shape === "reverse-l") {

        return `

            <div class="shape shape-reverse-l">

                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>

            </div>

        `;
    }


    /* 逆ト */

    if (shape === "reverse-t") {

        return `

            <div class="shape shape-reverse-t">

                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>

            </div>

        `;
    }


    /* ト */

    if (shape === "t") {

        return `

            <div class="shape shape-t">

                <div class="shape-line vertical"></div>
                <div class="shape-line horizontal"></div>

            </div>

        `;
    }


    /* 横棒 */

    if (shape === "horizontal") {

        return `

            <div class="shape shape-horizontal">

                <div class="shape-line horizontal"></div>

            </div>

        `;
    }


    /* 1マス部屋 */

    if (shape === "room") {

        return `

            <div class="shape shape-room">

                <svg viewBox="0 0 75 55">

                    <rect
                        x="18"
                        y="10"
                        width="39"
                        height="35"
                        rx="2"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;
    }


    /* 1マス＋十字 */

    if (shape === "room-cross") {

        return `

            <div class="shape shape-room-cross">

                <svg viewBox="0 0 75 55">

                    <rect
                        x="7"
                        y="18"
                        width="25"
                        height="20"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                    <line
                        x1="32"
                        y1="28"
                        x2="68"
                        y2="28"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                    <line
                        x1="50"
                        y1="8"
                        x2="50"
                        y2="48"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;
    }


    /* 1マス＋I字 */

    if (shape === "room-i") {

        return `

            <div class="shape shape-room-i">

                <svg viewBox="0 0 75 55">

                    <rect
                        x="7"
                        y="15"
                        width="25"
                        height="25"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                    <line
                        x1="48"
                        y1="7"
                        x2="48"
                        y2="48"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;
    }


    /* 1マス＋ホール */

    if (shape === "room-hall") {

        return `

            <div class="shape shape-hall">

                <svg viewBox="0 0 75 55">

                    <rect
                        x="5"
                        y="16"
                        width="22"
                        height="23"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                    <rect
                        x="30"
                        y="8"
                        width="40"
                        height="39"
                        rx="4"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;
    }


    /* 凸 */

    if (shape === "convex") {

        return `

            <div class="shape shape-convex">

                <svg viewBox="0 0 75 55">

                    <polyline
                        points="
                            5,45
                            5,25
                            25,25
                            27,10
                            48,10
                            50,25
                            70,25
                            70,45
                            5,45
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linejoin="round"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

        `;
    }


    /* 上下分岐 */

    if (shape === "y-complex") {

        return `

            <div class="shape shape-y">

                <svg viewBox="0 0 75 55">

                    <polyline
                        points="
                            2,28
                            40,28
                            40,7
                            70,7
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <polyline
                        points="
                            40,28
                            58,28
                            58,49
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

        `;
    }


    /* 大部屋 */

    if (shape === "big-room") {

        return `

            <div class="shape shape-room">

                <svg viewBox="0 0 75 55">

                    <rect
                        x="8"
                        y="8"
                        width="59"
                        height="39"
                        rx="5"
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                    />

                </svg>

            </div>

        `;
    }


    /* 逆L＋横棒 */

    if (shape === "complex") {

        return `

            <div class="shape shape-complex">

                <svg viewBox="0 0 75 55">

                    <polyline
                        points="
                            4,43
                            31,43
                            31,10
                            70,10
                        "
                        fill="none"
                        stroke="#8f76b5"
                        stroke-width="5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>

        `;
    }


    return "";
}


/* =====================================================
   結果表示
===================================================== */

function showResult(
    location,
    recommendation
) {

    hideAllScreens();


    document
        .getElementById("result-location")
        .textContent =
            location;


    document
        .getElementById("result-recommendation")
        .textContent =
            recommendation;


    document
        .getElementById("result-screen")
        .classList
        .remove("hidden");
}


/* =====================================================
   全画面非表示
===================================================== */

function hideAllScreens() {

    document
        .getElementById("entrance-screen")
        .classList
        .add("hidden");

    document
        .getElementById("special-screen")
        .classList
        .add("hidden");

    document
        .getElementById("pattern-screen")
        .classList
        .add("hidden");

    document
        .getElementById("result-screen")
        .classList
        .add("hidden");
}


/* =====================================================
   ホームへ
===================================================== */

function goHome() {

    currentEntrance = null;

    hideAllScreens();

    document
        .getElementById("entrance-screen")
        .classList
        .remove("hidden");
}

</script>
